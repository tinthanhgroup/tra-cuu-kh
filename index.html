<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra cứu dịch vụ bảo dưỡng</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
  /* Phong cách "Giao diện 1 – tinh tế": Kien truc agent/giao-dien-1-tinh-te/QUY_CHUAN.md */
  :root {
    --bg: #f4f5f8; --card: #ffffff; --border: #e6e8ee; --line: #eef0f4; --head: #f7f8fa;
    --text: #1f2329; --muted: #6b7280; --hint: #9aa1ad;
    --accent: #3b5bdb; --accent-hover: #324fc4; --accent-soft: #eef2ff; --accent-line: #d6defa; --gold: #f0b429;
    /* Cỡ chữ (máy tính): 12 nhãn, chú thích · 13 chữ phụ, bảng · 14 chữ chính · 16 tiêu đề khung · 20 biển số, số chính · 24 kết luận tư vấn */
    --fs-1: 12px; --fs-2: 13px; --fs-3: 14px; --fs-4: 16px; --fs-5: 20px; --fs-6: 24px;
    --red: #c62828; --red-bg: #fdecec; --amber: #a35f00; --amber-bg: #fff4e0; --green: #2e7d32; --green-bg: #e8f5e9;
    --radius: 8px; --radius-sm: 6px; --shadow: 0 1px 2px rgba(16,24,40,.04);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--fs-3)/1.5 Inter, system-ui, sans-serif; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  button, input { font-family: inherit; }
  .so-lieu { font-variant-numeric: tabular-nums; }
  .mo { color: var(--muted); }
  [hidden] { display: none !important; }

  /* Thanh trên cùng */
  .topbar { background: var(--accent); color: #fff; }
  .topbar-in { max-width: 1376px; margin: 0 auto; height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
  .topbar h1 { margin: 0; font-size: var(--fs-4); font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .cn { font-size: var(--fs-1); font-weight: 400; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,.18); margin-left: 8px; vertical-align: 2px; }
  .topbar .ai { font-size: var(--fs-2); opacity: .85; }
  .topbar button { height: 32px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; font-size: var(--fs-2); font-weight: 400; cursor: pointer; }

  main { max-width: 1376px; margin: 0 auto; padding: 0 16px 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 20px; margin-bottom: 16px; }
  .card-title { margin: 0; font-size: var(--fs-4); font-weight: 500; }
  .sub-title { font-size: var(--fs-2); color: var(--muted); margin: 16px 0 0; }
  .chu-thich { color: var(--muted); font-size: var(--fs-1); margin-top: 12px; }
  .dong-phu { font-size: var(--fs-2); color: var(--muted); margin-top: 4px; }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: var(--fs-1); font-weight: 400; white-space: nowrap; background: #f2f3f5; color: #4b5563; }
  .tag.do { background: var(--red-bg); color: var(--red); }
  .tag.cam { background: var(--amber-bg); color: var(--amber); }
  .tag.xanh { background: var(--green-bg); color: var(--green); }
  .t-cam { color: var(--amber); }
  .t-xanh { color: var(--green); }
  .t-nhan { color: var(--accent); }
  .tag.bd { background: var(--accent-soft); color: var(--accent); }

  .btn { height: 36px; padding: 0 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: var(--fs-3); font-weight: 400; cursor: pointer; white-space: nowrap; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: .6; cursor: default; }
  input { height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--fs-3); color: var(--text); background: var(--card); width: 100%; min-width: 0; }
  input::placeholder { color: var(--hint); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .loi { color: var(--red); font-size: var(--fs-2); }
  .loi:empty { display: none; }

  /* Đăng nhập */
  .dang-nhap { max-width: 360px; margin: 48px auto; }
  .dang-nhap .card-title { margin-bottom: 16px; }
  .dang-nhap input { margin-bottom: 12px; }
  .dang-nhap .btn { width: 100%; }

  /* Ô tra cứu: giữ trên đầu khi cuộn */
  .thanh-tra { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: 16px; }
  .thanh-tra .card { padding: 12px 16px; }
  .hang-nhap { display: grid; grid-template-columns: minmax(0, 360px) 150px auto; gap: 8px; justify-content: start; }
  .cap-nhat { font-size: var(--fs-1); color: var(--muted); margin-top: 8px; }

  /* Khách */
  .xe { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .bien { font-size: var(--fs-5); font-weight: 500; }
  .khach { font-size: var(--fs-2); color: var(--muted); margin-top: 2px; }
  .the-phu { font-size: var(--fs-2); color: var(--muted); }
  .sao { font-size: var(--fs-2); color: var(--muted); letter-spacing: 1px; }
  /* Bố cục máy tính (README "Bố cục trang"): trái khung Khách hàng, phải Tư vấn hôm nay + Lịch sử */
  /* Hai cột cao bằng nhau: khung Khách hàng kéo dài bằng cột phải, Lịch sử giãn lấp phần còn lại */
  .ket-qua { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 16px; align-items: stretch; }
  .ket-qua.ba-cot { grid-template-columns: 400px minmax(0, 1fr) 88px; }
  .ket-qua > div { display: flex; flex-direction: column; }
  .ket-qua > div > .card:last-child { flex: 1; margin-bottom: 0; }
  .ket-qua > div > #lich-su { flex: 1; }
  .ket-qua > div > .card.hanh-trinh { flex: none; }
  /* Cột công cụ: 9 hạng mục GTGT dạng biểu tượng, rê chuột hiện mô tả, tác dụng, định kỳ, tình trạng của xe */
  .cong-cu { padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cong-cu .nhan-muc { margin-bottom: 4px; }
  .cc-muc { position: relative; width: 76px; padding: 6px 2px; border-radius: var(--radius-sm); text-align: center; cursor: default; }
  .cc-muc:hover { background: var(--head); }
  .cc-muc .bt { width: 36px; height: 36px; margin: 0 auto; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .cc-muc.nay .bt { background: var(--accent); color: #fff; }
  .cc-muc .ten { display: block; font-size: var(--fs-1); color: var(--muted); line-height: 1.3; margin-top: 4px; }
  .cc-muc .stt { position: absolute; top: 2px; right: 12px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--card); color: var(--accent); border: 1px solid var(--accent-line); font-size: 11px; line-height: 14px; }
  .cc-muc .tip { display: none; position: absolute; right: calc(100% + 8px); top: 0; width: 300px; z-index: 20; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(16,24,40,.12); padding: 12px 14px; font-size: var(--fs-2); line-height: 1.5; cursor: auto; }
  .cc-muc.duoi .tip { top: auto; bottom: 0; }
  .cc-muc:hover .tip { display: block; }
  .tip .t1 { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-3); font-weight: 500; margin-bottom: 6px; }
  .tip .t1 .gia { font-weight: 400; color: var(--muted); }
  .tip .dong { margin-top: 4px; }
  .tip .dong b { font-weight: 500; color: var(--muted); }
  .tip .xe-nay { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  /* Hành trình km: trục km, bảo dưỡng phía trên, sửa chữa/bảo hành/bảo hiểm phía dưới */
  .hanh-trinh .dau-card { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .ht { position: relative; margin: 12px 8px 4px; }
  .ht .truc { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent-line); }
  .ht .vach { position: absolute; width: 1px; height: 6px; background: var(--hint); }
  .ht .so-vach { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--hint); white-space: nowrap; }
  .ht .noi { position: absolute; width: 1px; background: var(--border); z-index: 0; }
  .ht .the, .ht .cham { z-index: 1; }
  .ht .cham { position: absolute; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; border: 2px solid var(--card); background: var(--hint); }
  .ht .the { position: absolute; transform: translateX(-50%); padding: 2px 6px; border-radius: 4px; font-size: var(--fs-1); line-height: 1.25; text-align: center; white-space: nowrap; background: var(--head); color: var(--muted); cursor: default; }
  .ht .the .k { display: block; font-size: 11px; opacity: .8; }
  .ht .the.bd, .ht .cham.bd { background: var(--accent-soft); color: var(--accent); }
  .ht .cham.bd { background: var(--accent); }
  .ht .the.bh, .ht .cham.bh { background: var(--green-bg); color: var(--green); }
  .ht .cham.bh { background: var(--green); }
  .ht .the.bhi, .ht .cham.bhi { background: var(--red-bg); color: var(--red); }
  .ht .cham.bhi { background: var(--red); }
  .ht .the.ds, .ht .cham.ds { background: var(--amber-bg); color: var(--amber); }
  .ht .cham.ds { background: var(--amber); }
  /* BD chờ sửa: hồng nhạt như nhãn bảo hiểm, chưa tính là đã làm */
  .ht .the.cho { background: var(--red-bg); color: var(--red); }
  .ht .cham.cho { background: var(--red); }
  .ht .the.nay { background: var(--card); color: var(--accent); border: 1px dashed var(--accent); }
  .ht .noi.nay { border-left: 1px dashed var(--accent); background: none; }
  .nhan-muc { font-size: var(--fs-2); color: var(--muted); }
  .nhan-muc.tach { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  /* Khung Khách hàng: ảnh xe bên trái, 3 số chính xếp dọc bên phải; chân dung 6 nhóm mỗi nhóm một dòng */
  /* Ảnh xe rộng hết khung, 3 số chính xếp ngang bên dưới */
  .anh-so { margin-top: 8px; }
  .anh-xe { display: block; width: 73%; height: 110px; margin: 24px auto; object-fit: contain; }
  .ds-so { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .o-nho { display: flex; gap: 8px; align-items: flex-start; white-space: nowrap; min-width: 0; }
  .o-nho .nhan, .o-nho .phu { font-size: var(--fs-1); color: var(--muted); }
  .o-nho .nhan { line-height: 1.2; }
  .o-nho .so { font-size: var(--fs-5); font-weight: 500; line-height: 1.3; }
  .ds-nhom { margin-top: 4px; }
  .dong-nhom { padding: 2px 10px; border-radius: var(--radius-sm); color: var(--muted); }
  .dong-nhom .d1 { display: flex; gap: 10px; align-items: baseline; }
  .dong-nhom .stt { width: 14px; font-variant-numeric: tabular-nums; }
  .dong-nhom .ten { flex: 1; }
  .dong-nhom .sao .day { color: var(--gold); }
  .dong-nhom .sao .rong { color: #d5d9e0; }
  .dong-nhom.la { background: var(--accent-soft); color: var(--text); margin: 4px 0; padding: 8px 10px; }
  .dong-nhom.la.cam { background: var(--amber-bg); }
  .dong-nhom.la.xanh { background: var(--green-bg); }
  .dong-nhom.la .ten { font-size: var(--fs-4); }
  .chi-tiet { margin: 4px 0 0 24px; font-size: var(--fs-2); }
  .chi-tiet .dn { color: var(--muted); font-size: var(--fs-1); }
  /* Tư vấn hôm nay: viền trên màu nhấn, hai nửa bảo dưỡng | GTGT, dòng chính cỡ lớn để nhìn lướt */
  .ket-qua .card { border-color: var(--accent-line); }
  .hai-muc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 24px; margin-top: 8px; }
  .hai-muc .muc + .muc { border-left: 1px solid var(--line); padding-left: 24px; }
  .muc .chinh { font-size: var(--fs-6); font-weight: 500; line-height: 1.3; margin: 2px 0 6px; }
  .muc-bd { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 16px; }
  .muc .nhan-muc { display: flex; align-items: center; gap: 8px; }
  .muc-bd .bt { width: 28px; height: 28px; border-radius: 50%; background: var(--card); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .muc .hm .d2 { font-size: var(--fs-1); color: var(--muted); margin-top: 1px; padding-left: 28px; }
  /* Số thứ tự hạng mục GTGT khuyến nghị */
  .stt-hm { width: 20px; height: 20px; flex: none; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: var(--fs-1); display: inline-flex; align-items: center; justify-content: center; }
  .hai-muc .muc + .muc { border-left: 0; padding-left: 0; }
  .dong-bh { display: flex; white-space: nowrap; align-items: center; gap: 6px; margin-top: 10px; font-size: var(--fs-2); }
  .dong-bh .cham { color: var(--hint); }
  .btn-primary { display: inline-flex; align-items: center; gap: 6px; }
  .ls.dau-bang { color: var(--text); font-size: var(--fs-2); font-weight: 500; background: var(--head); border-top: 0; padding: 8px; border-radius: var(--radius-sm); margin-top: 8px; }
  .ds-ls .ls { padding-left: 8px; padding-right: 8px; }
  .muc .phu-chinh { font-size: var(--fs-3); font-weight: 400; }
  /* Công việc cần làm sớm (KTV ghi ở lần trước): dải vàng nhạt dưới hai khối tư vấn */
  .lam-som { margin-top: 14px; padding: 10px 14px; background: var(--amber-bg); border-left: 3px solid var(--gold); border-radius: var(--radius-sm); font-size: var(--fs-3); line-height: 1.5; }
  .lam-som .nhan { color: var(--amber); font-weight: 500; }
  .lam-som .ngay { color: var(--muted); font-size: var(--fs-1); }
  .muc .than { font-size: var(--fs-2); margin-top: 6px; }
  .muc .ds-hm { margin-top: 0; }
  .muc .hm { padding: 4px 0; border-top: 0; }
  .muc .chu-thich { margin-top: 6px; }
  /* Lịch sử: một dòng mỗi lần vào xưởng */
  .ls { display: grid; grid-template-columns: 80px 84px 156px minmax(0, 1fr) 100px; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: var(--fs-2); white-space: nowrap; }
  .ds-ls { margin-top: 8px; }
  .ds-ls .ls:first-child { border-top: 0; }
  .ls .r { text-align: right; }
  .ls .nd { overflow: hidden; text-overflow: ellipsis; font-size: var(--fs-2); }
  .lien { color: var(--accent); cursor: pointer; font-size: var(--fs-2); }
  details summary { margin-top: 6px; }

  /* Hạng mục */
  .dau-card { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .dau-card .tong { font-weight: 500; font-size: var(--fs-4); }
  .hm { padding: 8px 0; border-top: 1px solid var(--line); }
  .hm:first-child { border-top: 0; }
  .hm .d1 { display: flex; align-items: center; gap: 8px; }
  .hm .ten { font-size: var(--fs-3); }
  .hm .gia { margin-left: auto; white-space: nowrap; }
  .hm .d2 { font-size: var(--fs-1); color: var(--muted); }
  .ds-hm { margin-top: 8px; }

  /* Lịch sử */
  .loc { display: flex; gap: 8px; margin-left: auto; }
  .loc button { height: 32px; padding: 0 12px; font-size: var(--fs-2); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--text); cursor: pointer; white-space: nowrap; }
  .loc .ngan { display: none; }
  @media (max-width: 640px) { .loc .ngan { display: inline; } }
  .loc button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .dash { color: var(--hint); }
  details summary { list-style: none; margin-top: 8px; }
  details summary::-webkit-details-marker { display: none; }
  details summary .btn { display: flex; align-items: center; justify-content: center; width: 100%; pointer-events: none; }
  details[open] summary { display: none; }
  .goi-y button { margin: 12px 8px 0 0; }
  a { color: var(--accent); text-decoration: none; }
  .bang { width: 100%; border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .bang th { background: var(--head); font-size: var(--fs-2); font-weight: 500; text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .bang td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .bang .r { text-align: right; white-space: nowrap; }
  @media (max-width: 640px) { .bang th, .bang td { padding: 8px 6px; font-size: var(--fs-2); } }

  @media (min-width: 700px) {
    .thanh-tra .card { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
    .thanh-tra .cap-nhat { margin: 0 0 0 auto; }
    .thanh-tra .loi { flex-basis: 100%; }
  }
  @media (max-width: 640px) {
    .card { padding: 16px; }
    input { height: 40px; font-size: var(--fs-4); }
    .btn, .loc button, .topbar button { min-height: 40px; }
    .hang-nhap { grid-template-columns: 1fr 88px auto; }
    .o-so > div { padding: 8px; }
    .o-so .nhan { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .o-so .nhan { font-size: var(--fs-1); }
    .o-so .so { font-size: var(--fs-5); }
    .topbar h1 { font-size: var(--fs-4); }
    .topbar .ai { display: none; }
    .ls .d1 { font-size: var(--fs-2); }
    .ls .nd { font-size: var(--fs-2); white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .loc button { padding: 0 10px; }
    .cn-tag { display: none; }
    .cn-nd { display: inline; }
    .dau-ls { flex-wrap: nowrap; align-items: center; }
    .dau-ls .card-title { white-space: nowrap; }
    .loc .dai { display: none; }
  }
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <h1>Tra cứu dịch vụ bảo dưỡng<span class="cn" id="cn"></span></h1>
  <span class="ai" id="ai"></span>
  <button id="thoat" hidden>Thoát</button>
</div></div>
<main>
  <section id="man-dn" class="card dang-nhap" hidden>
    <h2 class="card-title">Đăng nhập</h2>
    <input id="ma" placeholder="Mã CVDV" autocomplete="username" autocapitalize="characters">
    <input id="mk" type="password" placeholder="Mật khẩu" autocomplete="current-password">
    <button class="btn btn-primary" id="nut-dn">Đăng nhập</button>
    <div class="loi" id="loi-dn"></div>
  </section>

  <section id="man-tra" hidden>
    <div class="thanh-tra"><div class="card">
      <div class="hang-nhap">
        <input id="bien" placeholder="Biển số" autocapitalize="characters">
        <input id="km" type="number" inputmode="numeric" placeholder="Km (tùy chọn)" title="Km trên đồng hồ xe; không nhập thì trang ước tính">
        <button class="btn btn-primary" id="nut-tra"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Tra cứu</button>
      </div>
      <div class="loi" id="loi-tra"></div>
      <div class="cap-nhat" id="cap-nhat"></div>
    </div></div>
    <div id="ket-qua"></div>
  </section>
</main>

<script>
// 6 nhóm theo thứ tự ưu tiên (README "Phân nhóm khách"): [tên, nhận diện (hiện khi rê chuột), câu gợi ý, số sao khai thác GTGT, màu nền]
const NHOM = {
  tkh:  ['Tái kích hoạt bảo hành', 'Còn trong 5 năm/100.000 km, thiếu bảo dưỡng theo km, ma trận HTV cần bù', 'Giới thiệu chính sách tái kích hoạt, ưu tiên bảo dưỡng bù hoặc bảo dưỡng cấp lớn.', 2, 'cam'],

function goi(ham, ...thamSo) {
  if (window.google && google.script) {
    return new Promise((ok, loi) => google.script.run.withSuccessHandler(ok).withFailureHandler(loi)[ham](...thamSo));
  }
  // Không đặt Content-Type để là yêu cầu đơn giản (không bị chặn CORS), giống cách trang BH gọi TinThanh_Auth
  const ctrl = new AbortController(), hen = setTimeout(() => ctrl.abort(), 30000);
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ ham, thamSo }), signal: ctrl.signal })
    .then(r => r.json())
    .then(r => { if (!r.ok) throw new Error(r.loi); return r.kq; })
    .catch(e => { throw new Error(e.name === 'AbortError' ? 'Máy chủ phản hồi chậm, thử lại.' : e.message); })
    .finally(() => clearTimeout(hen));
}

/** Xếp nhóm lúc tra (thứ tự ưu tiên trong NHOM). Số lần thiếu bảo dưỡng chỉ tính theo km: các khoảng đã có (x.th)
 *  cộng khoảng từ lần BD cuối tới km hôm nay; tra ma trận HTV ra số lần bảo dưỡng bù. */
function xepNhom(x, km) {
  const N = META.nhom, nay = new Date();
  const thieu = x.th + (x.bdk != null ? Math.max(0, Math.floor((km - x.bdk - N.dung_sai) / N.chu_ky_bd)) : 0);
  const conBH = km <= N.han_bh_km && (!x.nsx || nay.getFullYear() - x.nsx <= N.han_bh_nam);
  const soBu = thieu && conBH ? META.ma_tran[Math.min(thieu, 10) - 1][Math.min(4, Math.max(0, Math.ceil(km / 20000) - 1))] : null;
  const vang = (nay - new Date(x.cuoi)) / 864e5;
  const nhom = soBu ? 'tkh' : vang >= N.vang ? 'giu' : !x.cobd ? 'moi' : x.kpd >= N.dich_vu ? 'dv'
    : x.bd > 0 && x.gt / x.bd >= META.ky_vong ? 'cham' : 'tk';
  return { nhom, thieu, soBu, muc: !soBu ? 0 : soBu === 1 ? 1 : soBu <= 3 ? 2 : 3 };
}

/** Hạng mục tới kỳ: phụ gia đứng đầu; còn lại hạng mục có lần làm trước, quá hạn nhiều nhất đứng trước; sau đó tới hạng mục chưa ghi nhận
 *  (có thể đã làm trước 01/2025). Xe đi ít: hạng mục có số tháng (phụ gia, giàn lạnh, khử mùi) tới kỳ cả khi đủ tháng.
 *  Chọn lần lượt cho tới khi chạm trần, còn lại để kỳ sau. */
function deXuat(x, kmNhap) {
  const kpd = x.kpd ?? META.kpd_md;
  const soNgay = Math.max(0, (Date.now() - new Date(x.ngkm)) / 864e5);
  const km = kmNhap || Math.round(x.km + kpd * soNgay);
  const diIt = x.kpd != null && x.kpd < META.nhom.di_it;
  const ds = META.hang_muc.filter(h => h.ma !== 'bl' || x.bl).map(h => {
    const cuoi = x.hm[h.ma];
    const ke = cuoi ? cuoi[1] + h.ck : h.ck * Math.max(1, Math.floor(km / h.ck));
    const thang = diIt && h.thang ? h.thang : null;
    const thangQua = thang && cuoi ? Math.floor((Date.now() - new Date(cuoi[0])) / (30.44 * 864e5)) : null;
    return Object.assign({}, h, { cuoi, ke, con: ke - km, thang, thangQua, denThang: !!thang && (!cuoi || thangQua >= thang) });
  });
  // Phụ gia tới kỳ luôn đứng đầu: dễ bán nhất (NT 01/2025–10/2026: 49% khách mua khi tới kỳ, hạng mục kế tiếp 20%; README)
  const toi = ds.filter(h => h.con <= 1000 || h.denThang).sort((a, b) => (b.ma === 'pg') - (a.ma === 'pg') || (!a.cuoi - !b.cuoi) || a.con - b.con);
  const nay = [], sau = []; let tong = 0;
  toi.forEach(h => { if (tong + h.gia <= META.tran) { nay.push(h); tong += h.gia; } else sau.push(h); });
  const sap = ds.filter(h => h.con > 1000 && h.con <= 5000 && !h.denThang).sort((a, b) => a.con - b.con);
  return { km, uoc: !kmNhap, kpd, nay, sau, sap, tong, diIt };
}

/** Cấp bảo dưỡng theo mốc (bảng giá BDĐK HTV): cấp 4(2) ghi là 5. README "Khuyến nghị cấp bảo dưỡng". */
const capMoc = m => m <= 1000 ? 1 : m % 80000 === 0 ? 5 : m % 40000 === 0 ? 4 : m % 20000 === 0 ? 3 : m % 10000 === 0 ? 2 : 1;
const tenCap = c => c === 5 ? '4(2)' : String(c);
const mocGan = k => k < 3000 ? 1000 : Math.round(k / 5000) * 5000;
const mocGiua = (a, b) => { const r = []; for (let m = a < 5000 ? 5000 : a + 5000; m < b; m += 5000) r.push(m); return r; };

/** Các lần BD đã làm (cũ → mới): mốc lấy từ nội dung "BD 40.000 km" nếu khớp km, không thì mốc gần km; cấp từ dòng công
 *  (0 = chưa biết, coi như làm đúng cấp của mốc). */
function lanBD(x) {
  return x.ls.filter(l => l[3] === 'BD' && l[7] !== 'Chờ sửa' && l[2] > 0).reverse().map(l => {
    const g = /BD\s*(\d{1,3}(?:[.,]\d{3})+|\d{3,6})\s*k?m/i.exec(l[6]);
    const so = g ? Number(g[1].replace(/[.,]/g, '')) : 0;
    const moc = so && Math.abs(so - l[2]) <= 3000 ? mocGan(so) : mocGan(l[2]);
    return { ngay: l[0], km: l[2], moc, lam: l[8] || capMoc(moc) };
  });
}

/** Khuyến nghị cấp BD hôm nay. Nợ cấp: mốc bị bỏ qua hoặc lần làm thấp hơn cấp của mốc, xóa khi đã làm cấp bằng/lớn hơn. */
function capBD(x, km, kmNhap) {
  if (!x.hd) return null;
  if (kmNhap) {
    const ngay = Math.max(1, (Date.now() - new Date(x.ngkm)) / 864e5);
    if (kmNhap < x.km - 100) return { canh: 'Km nhập thấp hơn lần trước (' + tien(x.km) + ' km). Kiểm tra lại km đồng hồ.' };
    if (kmNhap - x.km > 10000 && (kmNhap - x.km) / ngay > 300) return { canh: 'Km tăng ' + tien(kmNhap - x.km) + ' km trong ' + Math.round(ngay) + ' ngày, bất thường. Kiểm tra lại km đồng hồ.' };
  }
  const ds = lanBD(x), cuoi = ds[ds.length - 1];
  let no = { cap: 0 }, truoc = null;
  const boQua = (a, b) => mocGiua(a, b).forEach(m => { if (capMoc(m) > no.cap) no = { cap: capMoc(m), moc: m, ly: 'bo' }; });
  ds.forEach(e => {
    if (truoc != null) boQua(truoc, e.moc);
    if (e.lam >= no.cap) no = { cap: 0 };
    if (e.lam < capMoc(e.moc) && capMoc(e.moc) > no.cap) no = { cap: capMoc(e.moc), moc: e.moc, ly: 'thap', lam: e.lam };
    truoc = Math.max(truoc ?? 0, e.moc);
  });
  const ghi = [], thap = () => 'Ở mốc ' + tien(no.moc) + ' km chỉ làm cấp ' + tenCap(no.lam) + ', ';

  // Mốc đã làm (khách quay lại vì sửa chữa): chỉ hiện mốc sau
  if (cuoi && cuoi.moc >= mocGan(km) && km - cuoi.km < 2500) {
    const sau = cuoi.moc < 5000 ? 5000 : cuoi.moc + 5000, con = sau - km, c = Math.max(capMoc(sau), no.cap);
    if (no.cap) ghi.push((no.ly === 'thap' ? thap() : 'Chưa làm mốc ' + tien(no.moc) + ' km (cấp ' + tenCap(no.cap) + '), ') + 'lần bảo dưỡng tới nên làm bù cấp ' + tenCap(no.cap) + '.');
    if (!no.cap && con > 1000) return { chuaToi: true, moc: sau, cap: c, con, daMoc: cuoi.moc, ngay: cuoi.ngay };
    if (con <= 1000) ghi.push('Còn ' + tien(Math.max(0, con)) + ' km tới mốc ' + tien(sau) + ' km: nếu khách vào sửa chữa, có thể làm luôn bảo dưỡng.');
    return { daLam: true, moc: cuoi.moc, ngay: cuoi.ngay, sau, con, cap: c, no: no.cap > 0, ghi };
  }

  let moc = mocGan(km);
  const lech = km - moc;
  if (Math.abs(lech) > 1500) {
    const ben = lech > 0 ? moc + 5000 : moc - 5000;
    if (ben >= 1000 && capMoc(ben) >= 3 && capMoc(ben) > capMoc(moc) && !ds.some(e => e.moc === ben)) moc = ben;
  }
  if (truoc != null) boQua(truoc, moc);
  const cap = Math.max(capMoc(moc), no.cap);
  // Còn hơn 1.000 km tới mốc, mốc trước đã làm và không nợ cấp: chỉ một dòng "Chưa tới kỳ" (người dùng chốt 30/10/2026).
  // Chưa có lịch sử hoặc mốc trước chưa làm thì xe có thể đã tới kỳ: hiện đủ.
  if (moc - km > 1000 && cap === capMoc(moc) && cuoi && cuoi.moc >= moc - 5000) return { chuaToi: true, moc, cap, con: moc - km };
  if (no.cap > capMoc(moc) && no.ly === 'bo') ghi.push((no.moc > cuoi.moc ? 'Lần bảo dưỡng cuối ở ' + tien(cuoi.km) + ' km, chưa' : 'Đã bỏ qua, chưa') + ' làm mốc ' + tien(no.moc) + ' km (cấp ' + tenCap(no.cap)
    + ') nên làm cấp ' + tenCap(no.cap) + ' thay cho cấp ' + tenCap(capMoc(moc)) + '. Nếu khách đã bảo dưỡng nơi khác, hỏi cấp đã làm.');
  else if (no.cap > capMoc(moc)) ghi.push(thap() + 'nên làm bù cấp ' + tenCap(no.cap) + ' thay cho cấp ' + tenCap(capMoc(moc)) + '.');
  if (moc === 1000) ghi.push('Mốc 1.000 km miễn phí cho khách (P. Bán hàng trả).');
  if (km < moc && cap === capMoc(moc)) ghi.push('Còn ' + tien(moc - km) + ' km tới mốc: nếu khách vào sửa chữa, có thể làm luôn bảo dưỡng.');
  else if (km - moc > 1500) ghi.push('Đã quá mốc ' + tien(km - moc) + ' km.');
  if (!cuoi) ghi.push('Chưa có lịch sử bảo dưỡng từ 01/2025: hỏi khách đã bảo dưỡng ở đâu, cấp nào.');
  else if ((Date.now() - new Date(cuoi.ngay)) / 864e5 > 183) ghi.push('Đã ' + Math.floor((Date.now() - new Date(cuoi.ngay)) / (30.44 * 864e5)) + ' tháng từ lần bảo dưỡng trước.');
  return { moc, cap, ghi };
}

/** Nửa trái khung "Tư vấn hôm nay": cấp bảo dưỡng (dòng chính cỡ lớn để nhìn lướt), lý do ở dưới. */
function veCap(c, d, g) {
  // Lý do tối đa 3 dòng, đủ khi rê chuột
  // Khối bảo dưỡng có nền xanh nhạt và biểu tượng cờ lê để nổi khi nhìn lướt
  const khoi = (chinh, than, cuoi = '') => '<div class="muc muc-bd"><div class="nhan-muc"><span class="bt">' + BIEU_TUONG.lan + '</span>Bảo dưỡng</div><div class="chinh so-lieu">' + chinh + '</div>'
    + (than ? '<div class="than">' + than + '</div>' : '') + cuoi + '</div>';
  if (!c) return khoi('<span class="mo">Không áp dụng</span>', 'Xe hãng khác, không theo cấp bảo dưỡng Hyundai.');
  if (c.canh) return khoi('<span class="t-cam">Kiểm tra lại km</span>', c.canh);
  if (c.chuaToi) return khoi('<span class="mo">Chưa tới kỳ</span>', (c.daMoc ? 'Đã làm mốc ' + tien(c.daMoc) + ' km ngày ' + ngayVN(c.ngay) + '. ' : '')
    + 'Mốc sau ' + tien(c.moc) + ' km, cấp ' + tenCap(c.cap) + ', còn khoảng ' + tien(c.con) + ' km' + (d.uoc ? ' (km ước tính)' : '') + '.');
  const ghi = c.ghi.slice();
  if (g.nhom === 'tkh' && !c.daLam) ghi.push('Tính chung với bảo dưỡng bù theo chính sách tái kích hoạt bảo hành.');
  if (d.uoc) ghi.push('Km ước tính, nhập km đồng hồ để chọn đúng mốc.');
  // Đã làm mốc nhưng còn nợ cấp: việc cần làm (lần tới) lên dòng chính
  if (c.daLam && c.no) return khoi('Lần tới: cấp ' + tenCap(c.cap) + ' <span class="mo phu-chinh">· mốc ' + tien(c.sau) + ' km</span>',
    ['Đã làm mốc ' + tien(c.moc) + ' km ngày ' + ngayVN(c.ngay) + '.'].concat(ghi).join(' '));
  if (c.daLam) return khoi('<span class="mo">Đã làm mốc ' + tien(c.moc) + ' km</span>',
    ['Ngày ' + ngayVN(c.ngay) + '. Kỳ sau: mốc ' + tien(c.sau) + ' km, cấp ' + tenCap(c.cap) + '.'].concat(ghi).join(' '));
  return khoi('Cấp ' + tenCap(c.cap) + ' <span class="mo phu-chinh">· mốc ' + tien(c.moc) + ' km</span>', ghi.join(' '),
    '<div class="chu-thich" title="Bảng giá bảo dưỡng định kỳ HTV, CV141/2026">Lập lệnh đúng model, phiên bản và cấp theo bảng HTV.</div>');
}

/** Khung Khách hàng: xe, khách, 3 số chính và chân dung 6 nhóm (mỗi nhóm 1 dòng, tô nổi nhóm của khách kèm gợi ý). */
/** Năm sản xuất (ký tự 10 số khung) và bảo hành mặc định 5 năm/100.000 km, điều kiện nào tới trước (README "Tái kích hoạt"). */
function veBaoHanh(x, d) {
  const N = META.nhom, nam = new Date().getFullYear();
  const hetKm = d.km > N.han_bh_km, hetNam = x.nsx && nam - x.nsx > N.han_bh_nam;
  const bh = hetKm || hetNam ? tag('Hết hạn', '') + ' <span class="mo">' + (hetKm ? 'quá ' + tien(N.han_bh_km) + ' km' : 'quá ' + N.han_bh_nam + ' năm') + '</span>'
    : tag('Còn hạn', 'xanh') + ' <span class="mo">' + (x.nsx ? (x.nsx + N.han_bh_nam) + ' / ' : 'tới ') + tien(N.han_bh_km) + ' km' + (x.nsx ? '' : ', chưa rõ năm sản xuất') + '</span>';
  return '<div class="dong-bh">' + (x.nsx ? '<span>Sản xuất ' + x.nsx + '</span><span class="cham">·</span>' : '') + '<span>Bảo hành ' + bh + '</span></div>';
}

function veKhach(x, d, g, phu) {
  const tyLe = x.bd > 0 ? Math.round(x.gt / x.bd * 100) + '%' : '–';
  const kpd = (x.kpd == null ? '~' + META.kpd_md : tien(x.kpd)) + ' km/ngày';
  const ma = (x.m || '').toLowerCase().replace(/\s+/g, ''), mo = MODEL[ma];
  const anh = mo && anhXe(ma, x.nsx);
  // 3 số chính xếp ngang dưới ảnh xe
  const o = (bt, nhan, so, phu) => '<div class="o-nho"><div><div class="nhan">' + nhan + '</div>'
    + '<div class="so">' + so + '</div><div class="phu">' + phu + '</div></div></div>';
  return '<div class="card"><div class="xe"><span class="bien">' + esc(x.b) + '</span><span class="mo">' + esc(mo ? mo[0] : chuanModel(x.m)) + '</span></div>'
    + '<div class="khach">' + esc(chuanTen(x.kh)) + (x.dt ? ' · ' + esc(x.dt) : '')
    + (x.the.length ? ' · ' + esc(x.the.map(t => t === 'BD đều' ? 'bảo dưỡng đều' : t.charAt(0).toLowerCase() + t.slice(1)).join(', ')) : '') + '</div>'
    + '<div class="anh-so so-lieu' + (anh ? '' : ' khong-anh') + '">'
    + (anh ? '<img class="anh-xe" src="' + ANH_XE + anh + '.webp" alt="' + esc(mo[0]) + '" onerror="this.parentNode.classList.add(\'khong-anh\'); this.remove()">' : '')
    + '<div class="ds-so">' + o('km', d.uoc ? 'Km ước tính' : 'Km hôm nay', tien(d.km), kpd) + o('lan', 'Vào xưởng', x.sl + ' lần', 'tổng ' + trieu(x.tong))
    + o('tien', 'GTGT / BD', tyLe, trieu(x.gt).replace(' tr', '') + ' / ' + trieu(x.bd)) + '</div></div>'
    + veBaoHanh(x, d)
    + '<div class="nhan-muc tach">Chân dung khách hàng</div><div class="ds-nhom">'
    + Object.entries(NHOM).map(([ma, n], i) => {
      const la = ma === g.nhom, sao = '<span class="sao" title="Mức khai thác GTGT"><span class="day">' + '★'.repeat(n[3]) + '</span><span class="rong">' + '☆'.repeat(5 - n[3]) + '</span></span>';
      return '<div class="dong-nhom' + (la ? ' la ' + n[4] : '') + '" title="' + esc(n[1]) + '"><div class="d1"><span class="stt">' + (i + 1) + '</span><span class="ten">' + n[0] + '</span>' + sao + '</div>'
        + (la ? '<div class="chi-tiet"><div class="dn">' + n[1] + '</div><div><span class="mo">Gợi ý tư vấn:</span> ' + n[2] + '</div>' + phu.map(p => '<div class="dn">' + p + '</div>').join('') + '</div>' : '') + '</div>';
    }).join('') + '</div></div>';
}

function nhanHm(h) {
  if (!h.cuoi && (h.con <= 1000 || h.denThang)) return '';
  if (h.con < -1000) return tag('Quá ' + tien(-h.con) + ' km', 'do');
  if (h.con <= 1000) return tag('Tới kỳ', 'cam');
  if (h.denThang) return tag('Đã ' + h.thangQua + ' tháng', 'cam');
  return tag('Còn ' + tien(h.con) + ' km');
}

function dongHm(h, i) {
  const ck = tien(h.ck) + ' km' + (h.thang ? ' hoặc ' + h.thang + ' tháng' : '') + (h.thang && h.ma === 'gl' ? ', nếu xe có mùi' : '');
  const d2 = h.cuoi ? 'Lần cuối ' + ngayVN(h.cuoi[0]) + ' ở ' + tien(h.cuoi[1]) + ' km, chu kỳ ' + ck
    : 'Chu kỳ ' + ck;
  // Dòng 1: tên, nhãn quá hạn, giá; dòng 2: câu lợi ích để CVDV nói với khách. Lần cuối, chu kỳ hiện khi rê chuột
  return '<div class="hm" title="' + esc(d2) + '"><div class="d1">' + (i != null ? '<span class="stt-hm">' + (i + 1) + '</span>' : '') + '<span class="ten">' + esc(h.ten) + '</span>' + nhanHm(h)
    + '<span class="gia so-lieu">' + tien(h.gia) + ' đ</span></div>' + (LOI_ICH[h.ma] ? '<div class="d2">' + LOI_ICH[h.ma] + '</div>' : '') + '</div>';
}

// "BD 58.000 Km" khi nhãn đã ghi BD → "58.000 Km"
const TIEN_TO = { 'BD': 'BD', 'SCC': 'SCC', 'Bảo hiểm': 'BH', 'Bảo hành': 'BH' };
const hoaDau = s => s.charAt(0).toUpperCase() + s.slice(1);
const boKmDau = nd => hoaDau(nd.replace(/^\d{1,3}(\.\d{3})+\s*km\b/i, '').replace(/^[\s,;:.+\-–]+/, '').replace(/^\(\s*([^()]*?)\s*\)$/, '$1')).replace(/\bKm\b/g, 'km');
const boTienTo = (nd, pl) => TIEN_TO[pl] ? hoaDau(nd.replace(new RegExp('^' + TIEN_TO[pl] + '\\s*[-–:;]?\\s*', 'i'), '')) || nd : nd;

/** Một lần vào xưởng = một dòng: ngày, km, loại lệnh, nội dung (GTGT đứng đầu, cắt bớt, đủ khi rê chuột), tiền. */
function dongLs(l, hienCn) {
  const khacCn = hienCn && l[1] !== META.chi_nhanh;
  const loai = l[3] === 'Đồng sơn tiền mặt' ? 'Đồng sơn' : l[3] === 'BD' && l[8] ? 'BD cấp ' + tenCap(l[8]) : l[3];
  const nd = (khacCn ? 'Tại ' + l[1] + '. ' : '') + boKmDau(boTienTo(l[6], l[3]));
  return '<div class="ls so-lieu" title="' + esc(nd) + '"><span>' + ngayVN(l[0]) + '</span><span class="mo r">' + tien(l[2]) + ' km</span>'
    + '<span' + (l[3] === 'BD' && !l[8] ? ' title="Chưa ghi cấp"' : '') + '>' + tag(esc(loai), l[3] === 'BD' ? 'bd' : '') + (l[7] === 'Chờ sửa' ? ' ' + tag('Chờ sửa', 'cam') : '') + '</span>'
    + '<span class="nd">' + (l[5] ? l[5].split(', ').map(t => tag(esc(t), 'bd')).join(' ') + (nd ? ' ' : '') : '') + '<span class="mo">' + esc(nd) + '</span></span>'
    + '<span class="r">' + (l[4] ? tien(l[4]) + ' đ' : '<span class="dash">–</span>') + '</span></div>';
}

function veXe(x, kmNhap) {
  const d = deXuat(x, kmNhap), g = xepNhom(x, d.km);
  const phu = [];
  if (d.diIt) phu.push('Xe đi ít: xét thêm phụ gia, giàn lạnh, khử mùi theo tháng.');
  if (g.thieu && g.soBu === 0) phu.push('Có thể thiếu ' + g.thieu + ' lần bảo dưỡng, ma trận không cần bù (Mức 0): khách ký cam kết là tái kích hoạt được.');
  const kyVong = Math.round(x.bdu * META.ky_vong / 1e4) * 1e4;
  // Tái kích hoạt bảo hành: ghi trong dòng nhóm của khách
  if (g.nhom === 'tkh') {
    const ngoaiLe = g.muc === 2 ? ', hoặc 1 lần bảo dưỡng cấp lớn để có hiệu lực ngay' : g.muc === 3 ? ', hoặc bảo dưỡng cấp lớn và thêm 1 lần bảo dưỡng tiêu chuẩn' : '';
    phu.unshift('Ước tính thiếu ' + g.thieu + ' lần bảo dưỡng' + (d.uoc ? ' (km ước tính)' : '') + ': Mức ' + g.muc + ', bảo dưỡng bù ' + g.soBu + ' lần' + ngoaiLe
      + '. Tra DMS để chốt, quét lỗi GDS Mobile, lập biên bản giám định cho khách ký.');
  }

  // Khung "Tư vấn hôm nay": bảo dưỡng | GTGT, mỗi hạng mục một dòng; để kỳ sau gộp một dòng
  const ten = ds => ds.map(h => h.ten).join(', ');
  const gtgt = '<div class="muc"><div class="nhan-muc">GTGT khuyến nghị</div>'
    + '<div class="chinh so-lieu">' + (d.nay.length ? tien(d.tong) + ' đ <span class="mo phu-chinh">· ' + d.nay.length + ' hạng mục</span>' : '<span class="mo">Chưa có hạng mục tới kỳ</span>') + '</div>'
    + (d.nay.length ? '<div class="ds-hm">' + d.nay.map(dongHm).join('') + '</div>' : '')
    // Một dòng chú thích: để kỳ sau + kỳ vọng, trần
    + '<div class="chu-thich" title="Kỳ vọng bằng ' + Math.round(META.ky_vong * 100) + '% giá trị bảo dưỡng ước tính ' + trieu(x.bdu)
    + '. Giá tham khảo có VAT, trung vị tại ' + META.chi_nhanh + '. Rê chuột lên hạng mục để xem lần cuối và chu kỳ.">'
    + (d.sau.length || d.sap.length ? 'Để kỳ sau: ' + [d.sau.length ? ten(d.sau) + ' (vượt trần)' : '', d.sap.length ? 'sắp tới ' + ten(d.sap).toLowerCase() : ''].filter(Boolean).join('; ') + '. ' : '')
    + 'Kỳ vọng ≈ ' + tien(kyVong) + ' đ, trần ' + tien(META.tran) + ' đ.</div></div>';
  // Công việc cần làm sớm: phát hiện kỹ thuật KTV ghi ở lần gần nhất có ghi (lốp, ắc quy, phanh…), ngoài trần GTGT
  const lamSom = x.lsm ? '<div class="lam-som"><span class="nhan">Công việc cần làm sớm:</span> ' + esc(x.lsm[1])
    + ' <span class="ngay">(ghi ngày ' + ngayVN(x.lsm[0]) + ')</span></div>' : '';
  const tuVan = '<div class="card noi-bat"><h2 class="card-title">Tư vấn hôm nay</h2><div class="hai-muc">' + veCap(capBD(x, d.km, kmNhap), d, g) + gtgt + '</div>' + lamSom + '</div>';

  XE = x;
  return '<div class="ket-qua ba-cot"><div>' + veKhach(x, d, g, phu) + '</div><div>' + tuVan + veHanhTrinh(x, d)
    + '<div class="card" id="lich-su">' + veLs(x, false) + '</div></div><div>' + veCongCu(x, d) + '</div></div>';
}

/** Cột công cụ: mỗi hạng mục GTGT một biểu tượng; hạng mục khuyến nghị hôm nay tô đậm kèm số thứ tự như danh sách;
 *  rê chuột hiện làm gì, tác dụng, nên làm khi, định kỳ, giá và tình trạng của xe này. */
function veCongCu(x, d) {
  const muc = META.hang_muc.map((h, i) => {
    const stt = d.nay.findIndex(n => n.ma === h.ma);
    const cuoi = x.hm[h.ma];
    const tt = stt >= 0 ? 'Khuyến nghị hôm nay (số ' + (stt + 1) + ')'
      : d.sau.some(n => n.ma === h.ma) ? 'Đã tới kỳ, để kỳ sau vì vượt trần'
      : d.sap.some(n => n.ma === h.ma) ? 'Sắp tới kỳ' : h.ma === 'bl' && !x.bl ? 'Không áp dụng cho model này' : 'Chưa tới kỳ';
    const mt = MO_TA[h.ma] || ['', ''];
    const tip = '<div class="tip"><div class="t1"><span>' + esc(TEN_DAY[h.ma] || h.ten) + '</span><span class="gia so-lieu">' + tien(h.gia) + ' đ</span></div>'
      + (mt[0] ? '<div class="dong"><b>Làm gì:</b> ' + mt[0] + '</div>' : '')
      + (LOI_ICH[h.ma] ? '<div class="dong"><b>Tác dụng:</b> ' + LOI_ICH[h.ma] + '</div>' : '')
      + (mt[1] ? '<div class="dong"><b>Nên làm khi:</b> ' + mt[1] + '</div>' : '')
      + '<div class="dong so-lieu"><b>Định kỳ:</b> ' + tien(h.ck) + ' km' + (h.thang ? ', xe đi ít ' + h.thang + ' tháng' : '') + '</div>'
      + '<div class="xe-nay so-lieu"><b>Xe này:</b> ' + (cuoi ? 'lần cuối ' + ngayVN(cuoi[0]) + ' ở ' + tien(cuoi[1]) + ' km' : 'chưa ghi nhận từ 01/2025') + '. ' + tt + '.</div></div>';
    return '<div class="cc-muc' + (stt >= 0 ? ' nay' : '') + (i >= META.hang_muc.length - 3 ? ' duoi' : '') + '"><span class="bt">' + (BT_HM[h.ma] || '') + '</span>'
      + (stt >= 0 ? '<span class="stt">' + (stt + 1) + '</span>' : '') + '<span class="ten">' + esc(h.ten) + '</span>' + tip + '</div>';
  }).join('');
  return '<div class="card cong-cu"><div class="nhan-muc">GTGT</div>' + muc + '</div>';
}

/** Hành trình km: các lần vào xưởng đặt theo km trên một trục; bảo dưỡng phía trên, lần khác phía dưới; mốc hôm nay.
 *  Nhãn gần nhau thì xếp tầng (tối đa 3 tầng mỗi phía). */
function veHanhTrinh(x, d) {
  const ds = x.ls.filter(l => l[2] > 0).slice().reverse();
  if (!ds.length) return '';
  // Trục bắt đầu gần lần vào đầu tiên (xe km cao không dồn về bên phải); gần 0 thì lấy từ 0
  const max = Math.max(d.km, ...ds.map(l => l[2])) * 1.04, min = Math.min(...ds.map(l => l[2]));
  const buoc = [1000, 2000, 5000, 10000, 20000, 25000, 50000].find(b => (max - min) / b <= 9) || 100000;
  let goc = Math.floor(min / buoc) * buoc; if (goc <= 2 * buoc) goc = 0;
  const tran = Math.ceil(max / buoc) * buoc;
  const vt = k => Math.min(97, Math.max(3, (k - goc) / (tran - goc) * 100));
  const LOP = { 'Bảo hành': 'bh', 'Bảo hiểm': 'bhi', 'Đồng sơn tiền mặt': 'ds' };
  const TEN = { 'Bảo hành': 'Bảo hành', 'Bảo hiểm': 'Bảo hiểm', 'Đồng sơn tiền mặt': 'Đồng sơn' };
  const RONG = 9, CAO = 36;  // nhãn rộng khoảng 9% trục; mỗi tầng cao 36px
  const xep = arr => { const cuoi = []; return arr.map(o => { let t = cuoi.findIndex(p => o.v - p >= RONG); if (t < 0) t = cuoi.length < 3 ? cuoi.length : cuoi.indexOf(Math.min(...cuoi)); cuoi[t] = o.v; return Object.assign(o, { t }); }); };
  const tren = xep(ds.filter(l => l[3] === 'BD').map(l => ({ l, v: vt(l[2]), lop: l[7] === 'Chờ sửa' ? 'cho' : 'bd',
    ten: l[7] === 'Chờ sửa' ? 'BD chờ sửa' : l[8] ? 'Cấp ' + tenCap(l[8]) : 'BD' }))
    .concat([{ v: vt(d.km), lop: 'nay', ten: 'Hôm nay', km: d.km }]).sort((a, b) => a.v - b.v));
  const duoi = xep(ds.filter(l => l[3] !== 'BD').map(l => ({ l, v: vt(l[2]), lop: LOP[l[3]] || '', ten: TEN[l[3]] || l[3] })));
  const nT = Math.max(1, ...tren.map(o => o.t + 1)), nD = duoi.length ? Math.max(...duoi.map(o => o.t + 1)) : 0;
  const A = nT * CAO + 6, H = A + 22 + nD * CAO;
  const the = (o, top, noiTop, noiCao) => {
    const l = o.l, km = l ? l[2] : o.km;
    const tt = l ? ngayVN(l[0]) + ' · ' + tien(l[2]) + ' km · ' + (l[3] === 'BD' && l[8] ? 'BD cấp ' + tenCap(l[8]) : l[3]) + (l[7] === 'Chờ sửa' ? ' (chờ sửa)' : '')
      + (l[4] ? ' · ' + tien(l[4]) + ' đ' : '') + (l[6] ? '\n' + l[6] : '') : 'Km hôm nay' + (d.uoc ? ' (ước tính)' : '') + ': ' + tien(d.km);
    return '<div class="noi' + (o.lop === 'nay' ? ' nay' : '') + '" style="left:' + o.v + '%;top:' + noiTop + 'px;height:' + noiCao + 'px"></div>'
      + (o.lop !== 'nay' ? '<div class="cham ' + o.lop + '" style="left:' + o.v + '%;top:' + (A - 3) + 'px"></div>' : '')
      + '<div class="the so-lieu ' + o.lop + '" style="left:' + o.v + '%;top:' + top + 'px" title="' + esc(tt) + '">' + esc(o.ten) + '<span class="k">' + tien(km) + ' km</span></div>';
  };
  let h = '<div class="truc" style="top:' + A + 'px"></div>';
  for (let k = goc; k <= tran; k += buoc) {
    const p = (k - goc) / (tran - goc) * 100;
    h += '<div class="vach" style="left:' + p + '%;top:' + (A + 2) + 'px"></div><div class="so-vach so-lieu" style="left:' + p + '%;top:' + (A + 6) + 'px">' + (k ? tien(k / 1000) + 'k' : '0') + '</div>';
  }
  tren.forEach(o => { const top = A - (o.t + 1) * CAO; h += the(o, top, top + 30, A - top - 30); });
  duoi.forEach(o => { const top = A + 24 + o.t * CAO; h += the(o, top, A + 2, top - A - 2); });
  return '<div class="card hanh-trinh"><div class="dau-card"><h2 class="card-title">Hành trình km</h2>'
    + '<span class="chu-thich" style="margin:0">Trên trục: bảo dưỡng · dưới trục: sửa chữa, bảo hành, bảo hiểm · rê chuột xem chi tiết</span></div>'
    + '<div class="ht" style="height:' + H + 'px">' + h + '</div></div>';
}

/** Danh mục để kiểm tra: hạng mục GTGT (chu kỳ, giá tham khảo) và 6 nhóm khách. */
function veDanhMuc() {
  const den = META.gia_den ? ngayVN(META.gia_den) : '';
  const hm = META.hang_muc.map(h => '<tr><td>' + esc(h.ten) + (h.ma === 'bl' ? '<div class="mo">Santa Fe, Tucson, Palisade</div>' : '')
    + (h.ma === 'gl' ? '<div class="mo">Xe đi ít: khi xe có mùi</div>' : '') + '</td><td class="r">' + tien(h.ck) + ' km</td>'
    + '<td class="r">' + (h.thang ? h.thang + ' tháng' : '–') + '</td><td class="r">' + tien(h.gia) + ' đ</td></tr>').join('');
  const nh = Object.values(NHOM).map((n, i) => '<tr><td>' + (i + 1) + '</td><td>' + n[0] + '<div class="mo">' + n[1] + '</div></td>'
    + '<td class="r sao">' + '★'.repeat(n[3]) + '☆'.repeat(5 - n[3]) + '</td></tr>').join('');
  return '<div class="ket-qua"><div><div class="card"><h2 class="card-title">Danh mục GTGT</h2>'
    + '<table class="bang"><thead><tr><th>Hạng mục</th><th class="r">Chu kỳ</th><th class="r">Xe đi ít</th><th class="r">Giá tham khảo</th></tr></thead><tbody>' + hm + '</tbody></table>'
    + '<div class="chu-thich">Trần ' + tien(META.tran) + ' đ mỗi lần; kỳ vọng ' + Math.round(META.ky_vong * 100) + '% giá trị bảo dưỡng. Giá có VAT, trung vị tại '
    + META.chi_nhanh + (den ? ' đến ' + den : '') + '. Xe đi ít là dưới ' + META.nhom.di_it + ' km/ngày.</div></div></div>'
    + '<div><div class="card"><h2 class="card-title">Nhóm khách</h2>'
    + '<table class="bang"><thead><tr><th>#</th><th>Nhóm</th><th class="r">GTGT</th></tr></thead><tbody>' + nh + '</tbody></table>'
    + '<div class="chu-thich">Một xe khớp nhiều nhóm thì lấy nhóm đứng trước.</div></div></div></div>';
}

/** Lịch sử: mặc định 5 lần gần nhất + "Xem thêm"; lọc Bảo dưỡng thì hiện đủ mọi lần BD. */
function veLs(x, chiBD) {
  const hienCn = new Set(x.ls.map(l => l[1])).size > 1;
  const bd = x.ls.filter(l => l[3] === 'BD');
  const ds = chiBD ? bd : x.ls;
  const nut = (loc, ten, so) => '<button data-loc="' + loc + '" class="' + ((loc === 'bd') === chiBD ? 'on' : '') + '">' + ten + ' ' + so + '</button>';
  let h = '<div class="dau-card dau-ls"><h2 class="card-title">Lịch sử vào xưởng</h2><div class="loc">' + nut('tat', 'Tất cả', x.ls.length) + nut('bd', '<span class="dai">Bảo dưỡng</span><span class="ngan">BD</span>', bd.length) + '</div></div>';
  if (!ds.length) return h + '<p class="mo">Chưa có lần bảo dưỡng nào từ 01/2025.</p>';
  // Bình quân theo bộ lọc đang chọn (tiền gồm cả GTGT trong lệnh); số lần, tổng đã có ở ô Vào xưởng
  const tong = ds.reduce((s, l) => s + l[4], 0);
  h += '<div class="dong-phu so-lieu">Bình quân ' + trieu(tong / ds.length) + ' mỗi lần' + (chiBD ? ' bảo dưỡng' : '') + '</div>';
  const dau = chiBD ? ds : ds.slice(0, SO_LS_HIEN), con = chiBD ? [] : ds.slice(SO_LS_HIEN);
  return h + '<div class="ls dau-bang"><span>Ngày</span><span class="r">Km</span><span>Loại</span><span>Ghi chú</span><span class="r">Chi phí</span></div>'
    + '<div class="ds-ls">' + dau.map(l => dongLs(l, hienCn)).join('') + '</div>'
    + (con.length ? '<details><summary><span class="lien">Xem thêm ' + con.length + ' lần</span></summary>'
      + '<div class="ds-ls">' + con.map(l => dongLs(l, hienCn)).join('') + '</div></details>' : '');
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-loc]');
  if (b && XE) $('lich-su').innerHTML = veLs(XE, b.dataset.loc === 'bd');
});

$('nut-dn').onclick = dangNhap;
$('mk').onkeydown = e => { if (e.key === 'Enter') dangNhap(); };
$('nut-tra').onclick = () => traCuu();
$('bien').onkeydown = $('km').onkeydown = e => { if (e.key === 'Enter') traCuu(); };
$('thoat').onclick = thoat;

(async () => {
  try { PHIEN = JSON.parse(sessionStorage.getItem('gtgt')); } catch (e) {}
  if (PHIEN) {
    try { META = await goi('layMeta', PHIEN.token); return hien('tra'); } catch (e) { PHIEN = null; }
  }
  hien('dn');
})();
</script>
