<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra cứu dịch vụ bảo dưỡng</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
  /* Phong cách "Giao diện 1 – tinh tế": Kien truc agent/giao-dien-1-tinh-te/QUY_CHUAN.md */
  :root {
    --bg: #f4f5f8; --card: #ffffff; --border: #e6e8ee; --line: #eef0f4; --head: #f7f8fa;
    --text: #1f2329; --muted: #6b7280; --hint: #9aa1ad;
    --accent: #3b5bdb; --accent-hover: #324fc4; --accent-soft: #eef2ff; --accent-line: #d6defa; --gold: #f0b429;
    /* Cỡ chữ (máy tính): 12 nhãn, chú thích · 13 chữ phụ, bảng · 14 chữ chính · 16 tiêu đề khung · 20 biển số, số chính · 24 kết luận tư vấn */
    --fs-1: 12px; --fs-2: 13px; --fs-3: 14px; --fs-4: 16px; --fs-5: 20px; --fs-6: 24px;
    --red: #c62828; --red-bg: #fdecec; --amber: #a35f00; --amber-bg: #fff4e0; --green: #2e7d32; --green-bg: #e8f5e9;
    --radius: 8px; --radius-sm: 6px; --shadow: 0 1px 2px rgba(16,24,40,.04);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--fs-3)/1.5 Inter, system-ui, sans-serif; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  button, input { font-family: inherit; }
  .so-lieu { font-variant-numeric: tabular-nums; }
  .mo { color: var(--muted); }
  [hidden] { display: none !important; }

  /* Thanh trên cùng */
  .topbar { background: var(--accent); color: #fff; }
  .topbar-in { max-width: 1376px; margin: 0 auto; height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
  .topbar h1 { margin: 0; font-size: var(--fs-4); font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .cn { font-size: var(--fs-1); font-weight: 400; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,.18); margin-left: 8px; vertical-align: 2px; }
  .topbar .ai { font-size: var(--fs-2); opacity: .85; }
  .topbar button { height: 32px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; font-size: var(--fs-2); font-weight: 400; cursor: pointer; }

  main { max-width: 1376px; margin: 0 auto; padding: 0 16px 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 20px; margin-bottom: 16px; }
  .card-title { margin: 0; font-size: var(--fs-4); font-weight: 500; }
  .sub-title { font-size: var(--fs-2); color: var(--muted); margin: 16px 0 0; }
  .chu-thich { color: var(--muted); font-size: var(--fs-1); margin-top: 12px; }
  .dong-phu { font-size: var(--fs-2); color: var(--muted); margin-top: 4px; }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: var(--fs-1); font-weight: 400; white-space: nowrap; background: #f2f3f5; color: #4b5563; }
  .tag.do { background: var(--red-bg); color: var(--red); }
  .tag.cam { background: var(--amber-bg); color: var(--amber); }
  .tag.xanh { background: var(--green-bg); color: var(--green); }
  .t-cam { color: var(--amber); }
  .t-xanh { color: var(--green); }
  .t-nhan { color: var(--accent); }
  .tag.bd { background: var(--accent-soft); color: var(--accent); }

  .btn { height: 36px; padding: 0 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: var(--fs-3); font-weight: 400; cursor: pointer; white-space: nowrap; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: .6; cursor: default; }
  input { height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--fs-3); color: var(--text); background: var(--card); width: 100%; min-width: 0; }
  input::placeholder { color: var(--hint); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .loi { color: var(--red); font-size: var(--fs-2); }
  .loi:empty { display: none; }

  /* Đăng nhập */
  .dang-nhap { max-width: 360px; margin: 48px auto; }
  .dang-nhap .card-title { margin-bottom: 16px; }
  .dang-nhap input { margin-bottom: 12px; }
  .dang-nhap .btn { width: 100%; }

  /* Ô tra cứu: giữ trên đầu khi cuộn */
  .thanh-tra { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: 16px; }
  .thanh-tra .card { padding: 12px 16px; }
  .hang-nhap { display: grid; grid-template-columns: minmax(0, 360px) 150px auto; gap: 8px; justify-content: start; }
  .cap-nhat { font-size: var(--fs-1); color: var(--muted); margin-top: 8px; }

  /* Khách */
  .xe { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .bien { font-size: var(--fs-5); font-weight: 500; }
  .khach { font-size: var(--fs-2); color: var(--muted); margin-top: 2px; }
  .lan-cuoi { margin-top: 6px; white-space: nowrap; }
  .so-cach { display: inline-block; padding: 1px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .so-cach.cam { background: var(--amber-bg); color: var(--amber); }
  .the-phu { font-size: var(--fs-2); color: var(--muted); }
  .sao { font-size: var(--fs-2); color: var(--muted); letter-spacing: 1px; }
  /* Bố cục máy tính (README "Bố cục trang"): trái khung Khách hàng, phải Tư vấn hôm nay + Lịch sử */
  /* Hai cột cao bằng nhau: khung Khách hàng kéo dài bằng cột phải, Lịch sử giãn lấp phần còn lại */
  .ket-qua { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 16px; align-items: stretch; }
  .ket-qua.ba-cot { grid-template-columns: 400px minmax(0, 1fr) 88px; }
  .ket-qua.dm { grid-template-columns: repeat(2, minmax(0, 1fr)); }   /* Danh mục GTGT: 2 cột đều, bảng hạng mục không bị cắt cột giá */
  .ket-qua > div { display: flex; flex-direction: column; }
  .ket-qua > div > .card:last-child { flex: 1; margin-bottom: 0; }
  .ket-qua > div > #lich-su { flex: 1; }
  .ket-qua > div > .card.hanh-trinh { flex: none; }
  /* Cột công cụ: 9 hạng mục GTGT dạng biểu tượng, rê chuột hiện mô tả, tác dụng, định kỳ, tình trạng của xe */
  .cong-cu { padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cong-cu .nhan-muc { margin-bottom: 4px; }
  .cc-muc { position: relative; width: 76px; padding: 6px 2px; border-radius: var(--radius-sm); text-align: center; cursor: default; }
  .cc-muc:hover { background: var(--head); }
  .cc-muc .bt { width: 36px; height: 36px; margin: 0 auto; border-radius: 50%; background: #f2f3f5; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .cc-muc.nay .bt { background: var(--accent); color: #fff; }
  .cc-muc.cho .bt { background: var(--card); color: var(--accent); border: 1px solid var(--accent); }
  .cc-muc.ko .bt, .cc-muc.ko .ten { opacity: .4; }
  .cc-muc .ten { display: block; font-size: var(--fs-1); color: var(--muted); line-height: 1.3; margin-top: 4px; }
  .cc-muc .stt { position: absolute; top: 2px; right: 12px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--card); color: var(--accent); border: 1px solid var(--accent-line); font-size: var(--fs-1); line-height: 16px; }
  .cc-muc .tip { display: none; position: absolute; right: calc(100% + 8px); top: 0; width: 300px; z-index: 20; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(16,24,40,.12); padding: 12px 14px; font-size: var(--fs-2); line-height: 1.5; cursor: auto; }
  .cc-muc.duoi .tip { top: auto; bottom: 0; }
  .cc-muc:hover .tip { display: block; }
  .tip .t1 { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-3); font-weight: 500; margin-bottom: 6px; }
  .tip .t1 .gia { font-weight: 400; color: var(--muted); white-space: nowrap; }
  .tip .dong { margin-top: 4px; }
  .tip .dong b, .tip .xe-nay b { font-weight: 400; color: var(--muted); }
  .tip .xe-nay { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  /* Hành trình km: trục km, bảo dưỡng phía trên, sửa chữa/bảo hành/bảo hiểm phía dưới */
  .hanh-trinh .dau-card { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .ht { position: relative; margin: 12px 8px 4px; }
  .ht .truc { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent-line); }
  .ht .vach { position: absolute; width: 1px; height: 6px; background: var(--hint); }
  .ht .so-vach { position: absolute; transform: translateX(-50%); font-size: var(--fs-1); color: var(--muted); white-space: nowrap; }
  .ht .noi { position: absolute; width: 1px; background: var(--border); z-index: 0; }
  .ht .the, .ht .cham { z-index: 1; }
  .ht .cham { position: absolute; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; border: 2px solid var(--card); background: var(--hint); }
  .ht .the { position: absolute; transform: translateX(-50%); padding: 2px 6px; border-radius: 4px; font-size: var(--fs-1); line-height: 1.25; text-align: center; white-space: nowrap; background: var(--head); color: var(--muted); cursor: default; }
  .ht .the .k { display: block; font-size: var(--fs-1); opacity: .85; }
  .ht .the.bd, .ht .cham.bd { background: var(--accent-soft); color: var(--accent); }
  .ht .cham.bd { background: var(--accent); }
  /* BD chờ sửa: cam như nhãn "Chờ sửa" ở Lịch sử, chưa tính là đã làm */
  .ht .the.cho { background: var(--amber-bg); color: var(--amber); }
  .ht .cham.cho { background: var(--amber); }
  .ht .the.nay { background: var(--card); color: var(--accent); border: 1px dashed var(--accent); }
  .ht .noi.nay { border-left: 1px dashed var(--accent); background: none; }
  .nhan-muc { font-size: var(--fs-2); color: var(--muted); }
  .nhan-muc.tach { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); font-size: var(--fs-4); font-weight: 500; color: var(--text); margin-bottom: 4px; }
  /* Khung Khách hàng: ảnh xe bên trái, 3 số chính xếp dọc bên phải; chân dung 6 nhóm mỗi nhóm một dòng */
  /* Ảnh xe rộng hết khung, 3 số chính xếp ngang bên dưới */
  .anh-so { margin-top: 8px; }
  .anh-xe { display: block; width: 73%; height: 110px; margin: 32px auto; object-fit: contain; }
  .ds-so { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .o-nho { display: flex; gap: 8px; align-items: flex-start; white-space: nowrap; min-width: 0; }
  .o-nho .nhan, .o-nho .phu { font-size: var(--fs-1); color: var(--muted); }
  .o-nho .nhan { line-height: 1.2; }
  .o-nho .so { font-size: var(--fs-5); font-weight: 500; line-height: 1.3; }
  .ds-nhom { margin-top: 4px; }
  .dong-nhom { padding: 4px 12px; border-radius: var(--radius-sm); color: var(--muted); }
  .dong-nhom .d1 { display: flex; gap: 10px; align-items: baseline; }
  .dong-nhom .stt { width: 14px; font-variant-numeric: tabular-nums; }
  .dong-nhom .ten { flex: 1; }
  .dong-nhom .sao .day { color: var(--muted); }
  .dong-nhom .sao .rong { color: #d5d9e0; }
  .dong-nhom.la { background: var(--accent-soft); color: var(--text); margin: 4px 0; padding: 8px 10px; }
  .dong-nhom.la.cam { background: var(--amber-bg); }
  .dong-nhom.la.xanh { background: var(--green-bg); }
  .dong-nhom.la .ten { font-size: var(--fs-4); }
  .chi-tiet { margin: 4px 0 0 24px; font-size: var(--fs-2); }
  .chi-tiet .dn { color: var(--muted); font-size: var(--fs-1); }
  .chi-tiet .phu-nhom { font-size: var(--fs-2); color: var(--text); margin-top: 4px; }
  /* Tư vấn hôm nay: viền trên màu nhấn, hai nửa bảo dưỡng | GTGT, dòng chính cỡ lớn để nhìn lướt */
  .hai-muc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 24px; margin-top: 8px; }
  .hai-muc .muc + .muc { border-left: 1px solid var(--line); padding-left: 24px; }
  .muc .chinh { font-size: var(--fs-6); font-weight: 500; line-height: 1.3; margin: 2px 0 6px; }
  .muc-bd { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 16px; }
  .muc .nhan-muc { display: flex; align-items: center; gap: 8px; }
  .muc-bd .bt { width: 28px; height: 28px; border-radius: 50%; background: var(--card); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .muc .hm .d2 { font-size: var(--fs-1); color: var(--muted); margin-top: 1px; padding-left: 28px; }
  /* Số thứ tự hạng mục GTGT khuyến nghị */
  .stt-hm { width: 20px; height: 20px; flex: none; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: var(--fs-1); display: inline-flex; align-items: center; justify-content: center; }
  .hai-muc .muc + .muc { border-left: 0; padding-left: 0; }
  .dong-bh { display: flex; white-space: nowrap; align-items: center; gap: 6px; margin-top: 10px; font-size: var(--fs-2); }
  .dong-bh .cham { color: var(--hint); }
  .btn-primary { display: inline-flex; align-items: center; gap: 6px; }
  .ls.dau-bang { color: var(--text); font-size: var(--fs-2); font-weight: 500; background: var(--head); border-top: 0; padding: 8px; border-radius: var(--radius-sm); margin-top: 8px; }
  .ds-ls .ls { padding-left: 8px; padding-right: 8px; }
  .muc .phu-chinh { font-size: var(--fs-3); font-weight: 400; white-space: nowrap; }
  .muc .moc-phu { font-size: var(--fs-3); font-weight: 400; line-height: 1.4; }
  /* Công việc cần làm sớm (KTV ghi ở lần trước): khối nền xám nhạt dưới hai khối tư vấn, chỉ nhãn màu cam */
  .lam-som { margin-top: 16px; padding: 12px 16px; background: #f7f8fa; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--fs-3); line-height: 1.5; }
  .lam-som .nhan { color: var(--amber); }
  .lam-som .ngay { color: var(--muted); font-size: var(--fs-1); white-space: nowrap; }
  .muc .than { font-size: var(--fs-2); margin-top: 6px; }
  .muc .ds-hm { margin-top: 0; }
  .muc .hm { padding: 4px 0; border-top: 0; }
  .muc .chu-thich { margin-top: 6px; }
  /* Lịch sử: một dòng mỗi lần vào xưởng */
  .ls { display: grid; grid-template-columns: 80px 84px 156px minmax(0, 1fr) 100px; gap: 16px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: var(--fs-2); white-space: nowrap; }
  .ds-ls { margin-top: 8px; }
  .ds-ls .ls:first-child { border-top: 0; }
  .ls .r { text-align: right; }
  .ls .nd { overflow: hidden; text-overflow: ellipsis; font-size: var(--fs-2); }
  .lien { color: var(--accent); cursor: pointer; font-size: var(--fs-2); }
  details summary { margin-top: 6px; }

  /* Hạng mục */
  .dau-card { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .dau-card .tong { font-weight: 500; font-size: var(--fs-4); }
  .hm { padding: 8px 0; border-top: 1px solid var(--line); }
  .hm:first-child { border-top: 0; }
  .hm .d1 { display: flex; align-items: center; gap: 8px; }
  .hm .ten { font-size: var(--fs-3); }
  .hm .gia { margin-left: auto; white-space: nowrap; }
  .hm .d2 { font-size: var(--fs-1); color: var(--muted); }
  .ds-hm { margin-top: 8px; }

  /* Lịch sử */
  .loc { display: flex; gap: 8px; margin-left: auto; }
  .loc button { height: 32px; padding: 0 12px; font-size: var(--fs-2); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--text); cursor: pointer; white-space: nowrap; }
  .loc .ngan { display: none; }
  @media (max-width: 640px) { .loc .ngan { display: inline; } }
  .loc button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .dash { color: var(--hint); }
  details summary { list-style: none; margin-top: 8px; }
  details summary::-webkit-details-marker { display: none; }
  details summary .btn { display: flex; align-items: center; justify-content: center; width: 100%; pointer-events: none; }
  details[open] summary { display: none; }
  .goi-y button { margin: 12px 8px 0 0; }
  a { color: var(--accent); text-decoration: none; }
  /* Tổng hợp Lễ tân (tài khoản NT, DL, ADMIN): ô số chính, 2 cột bảng, 30 ngày gần nhất */
  .hang-bc { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hang-bc input { width: 160px; height: 32px; font: inherit; font-size: var(--fs-2); padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .hang-bc .loc { margin-left: 0; }
  .hang-bc #bc-ve { margin-left: auto; font-size: var(--fs-2); }
  .bc-so { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  /* Nhãn giãn hết phần trống để số các ô thẳng hàng khi nhãn dài 2 dòng */
  .bc-so > div { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; }
  .bc-so .nhan { font-size: var(--fs-1); color: var(--muted); }
  .bc-so .nhan:first-child { flex: 1; }
  .bc-so .so { font-size: var(--fs-6); font-weight: 500; margin-top: 2px; }
  .bc-so.dv-so .nhan:first-child { flex: 0 0 auto; min-height: 2.8em; }
  .bc-so.dv-so .so { flex: 1; display: flex; align-items: center; justify-content: center; margin: 6px 0; }
  .bc-so.dv-so .nhan:not(:first-child) { text-align: center; min-height: 1.4em; }
  .bc-chu { font-size: var(--fs-1); color: var(--muted); margin-top: 6px; }
  #man-bc .thanh-tra[hidden] + #bc-nd { padding-top: 16px; }
  .bang:not(.mo-het) tr.them { display: none; }
  .xem-them { background: none; border: 0; padding: 8px 0 0; font: inherit; font-size: var(--fs-2); color: var(--accent); cursor: pointer; }
  .bc-so .so.do, .t-do { color: var(--red); }
  .bc-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; align-items: start; }
  .bc-2 .card { margin-bottom: 0; }
  .bc-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }   /* 5 xe chờ lâu nhất | Theo CVDV | Khung giờ trên một hàng */
  @media (min-width: 641px) { .bc-3 .bang th, .bc-3 .bang td { padding-left: 8px; padding-right: 8px; } }
  @media (max-width: 1100px) { .bc-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .bc-3 { grid-template-columns: minmax(0, 1fr); } }
  /* Nhắc bảo dưỡng (project 26): khối trong kết quả tra xe + mục trong Tổng hợp */
  .nb-viec { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--head); font-size: var(--fs-3); }
  .nb-viec.gui { background: var(--accent-soft); color: var(--accent); }
  .nb-viec.goi, .nb-viec.khac { background: var(--amber-bg); color: var(--amber); }
  .nb-viec.bo { background: var(--red-bg); color: var(--red); }
  .nb-viec.xong { background: var(--green-bg); color: var(--green); }
  .nb-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin-top: 12px; font-size: var(--fs-2); }
  .nb-kv > span:nth-child(odd) { color: var(--muted); }
  .nb-tin { margin-top: 12px; font-size: var(--fs-2); }
  .nb-tin div { padding: 4px 0; border-top: 1px solid var(--line); }
  a[data-nb] { cursor: pointer; }

const DOI_XE = {

  const doi = DOI_XE[ma];
  if (!doi) return MODEL[ma] ? MODEL[ma][1] : '';
  if (!nsx) return MODEL[ma][1];

}

/** Xếp nhóm lúc tra (thứ tự ưu tiên trong NHOM). Số lần thiếu bảo dưỡng chỉ tính theo km: các khoảng đã có (x.th)
 *  cộng khoảng từ lần BD cuối tới km hôm nay; tra ma trận HTV ra số lần bảo dưỡng bù. */
function xepNhom(x, km) {
  const N = META.nhom, nay = new Date();
  const thieu = x.th + (x.bdk != null ? Math.max(0, Math.floor((km - x.bdk - N.dung_sai) / N.chu_ky_bd)) : 0);
  const conBH = km <= N.han_bh_km && (!x.nsx || nay.getFullYear() - x.nsx <= N.han_bh_nam);
  const soBu = thieu && conBH ? META.ma_tran[Math.min(thieu, 10) - 1][Math.min(4, Math.max(0, Math.ceil(km / 20000) - 1))] : null;
  const vang = (nay - new Date(x.cuoi)) / 864e5;
  const nhom = soBu ? 'tkh' : vang >= N.vang ? 'giu' : !x.cobd ? 'moi' : x.kpd >= N.dich_vu ? 'dv'
    : x.bd > 0 && x.gt / x.bd >= META.ky_vong ? 'cham' : 'tk';
  return { nhom, thieu, soBu, muc: !soBu ? 0 : soBu === 1 ? 1 : soBu <= 3 ? 2 : 3 };
}

/** Hạng mục tới kỳ: phụ gia đứng đầu; còn lại hạng mục có lần làm trước, quá hạn nhiều nhất đứng trước; sau đó tới hạng mục chưa ghi nhận
 *  (có thể đã làm trước 01/2025). Xe đi ít: hạng mục có số tháng (phụ gia, giàn lạnh, khử mùi) tới kỳ cả khi đủ tháng.
 *  Chọn lần lượt cho tới khi chạm trần, còn lại để kỳ sau. */
function deXuat(x, kmNhap) {
  const kpd = x.kpd ?? META.kpd_md;
  const soNgay = Math.max(0, (Date.now() - new Date(x.ngkm)) / 864e5);
  const km = kmNhap || Math.round(x.km + kpd * soNgay);
  const diIt = x.kpd != null && x.kpd < META.nhom.di_it;
  const ds = META.hang_muc.filter(h => h.ma !== 'bl' || x.bl).map(h => {
    const cuoi = x.hm[h.ma];
    const ke = cuoi ? cuoi[1] + h.ck : h.ck * Math.max(1, Math.floor(km / h.ck));
    const thang = diIt && h.thang ? h.thang : null;
    const thangQua = thang && cuoi ? Math.floor((Date.now() - new Date(cuoi[0])) / (30.44 * 864e5)) : null;
    return Object.assign({}, h, { cuoi, ke, con: ke - km, thang, thangQua, denThang: !!thang && (!cuoi || thangQua >= thang) });
  });
  // Phụ gia tới kỳ luôn đứng đầu: dễ bán nhất (NT 01/2025–10/2026: 49% khách mua khi tới kỳ, hạng mục kế tiếp 20%; README)
  const toi = ds.filter(h => h.con <= 1000 || h.denThang).sort((a, b) => (b.ma === 'pg') - (a.ma === 'pg') || (!a.cuoi - !b.cuoi) || a.con - b.con);
  const nay = [], sau = []; let tong = 0;
  toi.forEach(h => { if (tong + h.gia <= META.tran) { nay.push(h); tong += h.gia; } else sau.push(h); });
  const sap = ds.filter(h => h.con > 1000 && h.con <= 5000 && !h.denThang).sort((a, b) => a.con - b.con);
  return { km, uoc: !kmNhap, kpd, nay, sau, sap, tong, diIt };
}

/** Cấp bảo dưỡng theo mốc (bảng giá BDĐK HTV): cấp 4(2) ghi là 5. README "Khuyến nghị cấp bảo dưỡng". */
const capMoc = m => m <= 1000 ? 1 : m % 80000 === 0 ? 5 : m % 40000 === 0 ? 4 : m % 20000 === 0 ? 3 : m % 10000 === 0 ? 2 : 1;
const tenCap = c => c === 5 ? '4(2)' : String(c);
const mocGan = k => k < 3000 ? 1000 : Math.round(k / 5000) * 5000;
const mocGiua = (a, b) => { const r = []; for (let m = a < 5000 ? 5000 : a + 5000; m < b; m += 5000) r.push(m); return r; };

/** Các lần BD đã làm (cũ → mới): mốc lấy từ nội dung "BD 40.000 km" nếu khớp km, không thì mốc gần km; cấp từ dòng công
 *  (0 = chưa biết, coi như làm đúng cấp của mốc). */
function lanBD(x) {
  return x.ls.filter(l => l[3] === 'BD' && l[7] !== 'Chờ sửa' && l[2] > 0).reverse().map(l => {
    const g = /BD\s*(\d{1,3}(?:[.,]\d{3})+|\d{3,6})\s*k?m/i.exec(l[6]);
    const so = g ? Number(g[1].replace(/[.,]/g, '')) : 0;
    const moc = so && Math.abs(so - l[2]) <= 3000 ? mocGan(so) : mocGan(l[2]);
    return { ngay: l[0], km: l[2], moc, lam: l[8] || capMoc(moc) };
  });
}

/** Khuyến nghị cấp BD hôm nay. Nợ cấp: mốc bị bỏ qua hoặc lần làm thấp hơn cấp của mốc, xóa khi đã làm cấp bằng/lớn hơn. */
function capBD(x, km, kmNhap) {
  if (!x.hd) return null;
  if (kmNhap) {
    const ngay = Math.max(1, (Date.now() - new Date(x.ngkm)) / 864e5);
    if (kmNhap < x.km - 100) return { canh: 'Km nhập thấp hơn lần trước (' + tien(x.km) + ' km). Kiểm tra lại km đồng hồ.' };
    if (kmNhap - x.km > 10000 && (kmNhap - x.km) / ngay > 300) return { canh: 'Km tăng ' + tien(kmNhap - x.km) + ' km trong ' + Math.round(ngay) + ' ngày, bất thường. Kiểm tra lại km đồng hồ.' };
  }
  const ds = lanBD(x), cuoi = ds[ds.length - 1];
  let no = { cap: 0 }, truoc = null;
  const boQua = (a, b) => mocGiua(a, b).forEach(m => { if (capMoc(m) > no.cap) no = { cap: capMoc(m), moc: m, ly: 'bo' }; });
  ds.forEach(e => {
    if (truoc != null) boQua(truoc, e.moc);
    if (e.lam >= no.cap) no = { cap: 0 };
    if (e.lam < capMoc(e.moc) && capMoc(e.moc) > no.cap) no = { cap: capMoc(e.moc), moc: e.moc, ly: 'thap', lam: e.lam };
    truoc = Math.max(truoc ?? 0, e.moc);
  });
  const ghi = [], thap = () => 'Ở mốc ' + tien(no.moc) + ' km chỉ làm cấp ' + tenCap(no.lam) + ', ';

  // Mốc đã làm (khách quay lại vì sửa chữa): chỉ hiện mốc sau
  if (cuoi && cuoi.moc >= mocGan(km) && km - cuoi.km < 2500) {
    const sau = cuoi.moc < 5000 ? 5000 : cuoi.moc + 5000, con = sau - km, c = Math.max(capMoc(sau), no.cap);
    if (no.cap) ghi.push((no.ly === 'thap' ? thap() : 'Chưa làm mốc ' + tien(no.moc) + ' km (cấp ' + tenCap(no.cap) + '), ')
      + (capMoc(sau) >= no.cap ? 'mốc ' + tien(sau) + ' km làm cấp ' + tenCap(capMoc(sau)) + ' là đã gồm phần bù cấp ' + tenCap(no.cap) + '.'
        : 'mốc ' + tien(sau) + ' km nên làm bù cấp ' + tenCap(no.cap) + ' thay cho cấp ' + tenCap(capMoc(sau)) + '.'));
    if (!no.cap && con > 1000) return { chuaToi: true, moc: sau, cap: c, con, daMoc: cuoi.moc, ngay: cuoi.ngay };
    if (con <= 1000) ghi.push('Còn ' + tien(Math.max(0, con)) + ' km tới mốc ' + tien(sau) + ' km: nếu khách vào sửa chữa, có thể làm luôn bảo dưỡng.');
    return { daLam: true, moc: cuoi.moc, ngay: cuoi.ngay, sau, con, cap: c, no: no.cap > 0, ghi };
  }

  let moc = mocGan(km);
  const lech = km - moc;
  if (Math.abs(lech) > 1500) {
    const ben = lech > 0 ? moc + 5000 : moc - 5000;
    if (ben >= 1000 && capMoc(ben) >= 3 && capMoc(ben) > capMoc(moc) && !ds.some(e => e.moc === ben)) moc = ben;
  }
  if (truoc != null) boQua(truoc, moc);
  const cap = Math.max(capMoc(moc), no.cap);
  // Còn hơn 1.000 km tới mốc, mốc trước đã làm và không nợ cấp: chỉ một dòng "Chưa tới kỳ" (người dùng chốt 30/10/2026).
  // Chưa có lịch sử hoặc mốc trước chưa làm thì xe có thể đã tới kỳ: hiện đủ.
  if (moc - km > 1000 && cap === capMoc(moc) && cuoi && cuoi.moc >= moc - 5000) return { chuaToi: true, moc, cap, con: moc - km };
  if (no.cap > capMoc(moc) && no.ly === 'bo') ghi.push((no.moc > cuoi.moc ? 'Lần bảo dưỡng cuối ở ' + tien(cuoi.km) + ' km, chưa' : 'Đã bỏ qua, chưa') + ' làm mốc ' + tien(no.moc) + ' km (cấp ' + tenCap(no.cap)
    + ') nên làm cấp ' + tenCap(no.cap) + ' thay cho cấp ' + tenCap(capMoc(moc)) + '. Nếu khách đã bảo dưỡng nơi khác, hỏi cấp đã làm.');
  else if (no.cap > capMoc(moc)) ghi.push(thap() + 'nên làm bù cấp ' + tenCap(no.cap) + ' thay cho cấp ' + tenCap(capMoc(moc)) + '.');
  if (moc === 1000) ghi.push('Mốc 1.000 km miễn phí cho khách (P. Bán hàng trả).');
  if (km < moc && cap === capMoc(moc)) ghi.push('Còn ' + tien(moc - km) + ' km tới mốc: nếu khách vào sửa chữa, có thể làm luôn bảo dưỡng.');
  else if (km - moc > 1500) ghi.push('Đã quá mốc ' + tien(km - moc) + ' km.');
  if (!cuoi) ghi.push('Chưa có lịch sử bảo dưỡng từ 01/2025: hỏi khách đã bảo dưỡng ở đâu, cấp nào.');
  else if ((Date.now() - new Date(cuoi.ngay)) / 864e5 > 183) ghi.push('Đã ' + Math.floor((Date.now() - new Date(cuoi.ngay)) / (30.44 * 864e5)) + ' tháng từ lần bảo dưỡng trước.');
  return { moc, cap, ghi };
}

/** Nửa trái khung "Tư vấn hôm nay": cấp bảo dưỡng (dòng chính cỡ lớn để nhìn lướt), lý do ở dưới. */
function veCap(c, d, g) {
  // Lý do tối đa 3 dòng, đủ khi rê chuột
  // Khối bảo dưỡng có nền xanh nhạt và biểu tượng cờ lê để nổi khi nhìn lướt
  const khoi = (chinh, than, cuoi = '') => '<div class="muc muc-bd"><div class="nhan-muc"><span class="bt">' + BIEU_TUONG.lan + '</span>Bảo dưỡng</div><div class="chinh so-lieu">' + chinh + '</div>'
    + (than ? '<div class="than">' + than + '</div>' : '') + cuoi + '</div>';
  if (!c) return khoi('<span class="mo">Không áp dụng</span>', 'Xe hãng khác, không theo cấp bảo dưỡng Hyundai.');
  if (c.canh) return khoi('<span class="t-cam">Kiểm tra lại km</span>', c.canh);
  if (c.chuaToi) return khoi('<span class="mo">Chưa tới kỳ</span>', (c.daMoc ? 'Đã làm mốc ' + tien(c.daMoc) + ' km ngày ' + ngayVN(c.ngay) + '. ' : '')
    + 'Mốc sau ' + tien(c.moc) + ' km, cấp ' + tenCap(c.cap) + ', còn khoảng ' + tien(c.con) + ' km' + (d.uoc ? ' (km ước tính)' : '') + '.');
  const ghi = c.ghi.slice();
  if (d.uoc) ghi.push('Km ước tính, nhập km đồng hồ để chọn đúng mốc.');
  // Đã làm mốc nhưng còn nợ cấp: việc cần làm (lần tới) lên dòng chính
  if (c.daLam && c.no) return khoi('Lần tới: cấp ' + tenCap(c.cap) + '<div class="mo moc-phu">Mốc ' + tien(c.sau) + ' km</div>',
    ['Đã làm mốc ' + tien(c.moc) + ' km ngày ' + ngayVN(c.ngay) + '.'].concat(ghi).join(' '));
  if (c.daLam) return khoi('<span class="mo">Đã làm mốc ' + tien(c.moc) + ' km</span>',
    ['Ngày ' + ngayVN(c.ngay) + '. Kỳ sau: mốc ' + tien(c.sau) + ' km, cấp ' + tenCap(c.cap) + '.'].concat(ghi).join(' '));
  return khoi('Cấp ' + tenCap(c.cap) + '<div class="mo moc-phu">Mốc ' + tien(c.moc) + ' km</div>', ghi.join(' '),
    '<div class="chu-thich" title="Bảng giá bảo dưỡng định kỳ HTV, CV141/2026">Lập lệnh đúng model, phiên bản và cấp theo bảng HTV.</div>');
}

/** Khung Khách hàng: xe, khách, 3 số chính và chân dung 6 nhóm (mỗi nhóm 1 dòng, tô nổi nhóm của khách kèm gợi ý). */
/** Năm sản xuất (ký tự 10 số khung) và bảo hành mặc định 5 năm/100.000 km, điều kiện nào tới trước (README "Tái kích hoạt"). */
function veBaoHanh(x, d) {
  const N = META.nhom, nam = new Date().getFullYear();
  const hetKm = d.km > N.han_bh_km, hetNam = x.nsx && nam - x.nsx > N.han_bh_nam;
  const bh = hetKm || hetNam ? tag('Hết hạn', '') + ' <span class="mo">' + (hetKm ? 'quá ' + tien(N.han_bh_km) + ' km' : 'quá ' + N.han_bh_nam + ' năm') + '</span>'
    : tag('Còn hạn', 'xanh') + ' <span class="mo">' + (x.nsx ? (x.nsx + N.han_bh_nam) + ' / ' : 'tới ') + tien(N.han_bh_km) + ' km' + (x.nsx ? '' : ', chưa rõ năm sản xuất') + '</span>';
  return '<div class="dong-bh"><span>Bảo hành ' + bh + '</span></div>';
}

/** Vào xưởng gần nhất: dưới 1 tháng tính ngày, từ 1 tháng tính tháng (1 chữ số thập phân); số tô nổi để nhìn lướt
 *  (cam khi vắng từ ngưỡng "Cần giữ chân"); kèm CVDV lập lệnh lần đó. */
function veLanCuoi(x) {
  const l = x.ls.reduce((m, l) => !m || l[0] > m[0] ? l : m, null);
  if (!l) return '';
  const ngay = Math.max(0, Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(l[0] + 'T00:00:00')) / 864e5));
  const cach = ngay === 0 ? 'hôm nay' : ngay < 30 ? ngay + ' ngày' : String(Math.round(ngay / 30.4 * 10) / 10).replace('.', ',') + ' tháng';
  return '<div class="khach lan-cuoi">Vào xưởng gần nhất: <span class="so-cach' + (ngay >= META.nhom.vang ? ' cam' : '') + '">' + cach + '</span> '
    + ngayVN(l[0]) + (l[9] ? ' · ' + esc(l[9]) : '') + '</div>';
}

function veKhach(x, d, g, phu) {
  const tyLe = x.bd > 0 ? Math.round(x.gt / x.bd * 100) + '%' : '–';
  const kpd = (x.kpd == null ? '~' + META.kpd_md : tien(x.kpd)) + ' km/ngày';
  const ma = (x.m || '').toLowerCase().replace(/\s+/g, ''), mo = MODEL[ma];
  const anh = mo && anhXe(ma, x.nsx);
  // 3 số chính xếp ngang dưới ảnh xe
  const o = (bt, nhan, so, phu) => '<div class="o-nho"><div><div class="nhan">' + nhan + '</div>'
    + '<div class="so">' + so + '</div><div class="phu">' + phu + '</div></div></div>';
  return '<div class="card"><div class="xe"><span class="bien">' + esc(x.b) + '</span><span class="mo">' + esc(mo ? mo[0] : chuanModel(x.m)) + (x.nsx ? ' (SX ' + x.nsx + ')' : '') + '</span></div>'
    + '<div class="khach">' + esc(chuanTen(x.kh)) + (x.dt ? ' · ' + esc(x.dt) : '')
    + (x.the.length ? ' · ' + esc(x.the.map(t => t === 'BD đều' ? 'bảo dưỡng đều' : t.charAt(0).toLowerCase() + t.slice(1)).join(', ')) : '') + '</div>'
    + veLanCuoi(x)
    + '<div class="anh-so so-lieu' + (anh ? '' : ' khong-anh') + '">'
    + (anh ? '<img class="anh-xe" src="' + ANH_XE + anh + '.webp" alt="' + esc(mo[0]) + '" onerror="this.parentNode.classList.add(\'khong-anh\'); this.remove()">' : '')
    + '<div class="ds-so">' + o('km', d.uoc ? 'Km ước tính' : 'Km hôm nay', tien(d.km), kpd) + o('lan', 'Vào xưởng', x.sl + ' lần', 'tổng ' + trieu(x.tong))
    + o('tien', 'GTGT / BD', tyLe, trieu(x.gt).replace(' tr', '') + ' / ' + trieu(x.bd)) + '</div></div>'
    + veBaoHanh(x, d)
    + '<div class="nhan-muc tach">Chân dung khách hàng</div><div class="ds-nhom">'
    + Object.entries(NHOM).map(([ma, n], i) => {
      const la = ma === g.nhom, sao = '<span class="sao" title="Mức khai thác GTGT"><span class="day">' + '★'.repeat(n[3]) + '</span><span class="rong">' + '☆'.repeat(5 - n[3]) + '</span></span>';
      return '<div class="dong-nhom' + (la ? ' la ' + n[4] : '') + '" title="' + esc(n[1]) + '"><div class="d1"><span class="stt">' + (i + 1) + '</span><span class="ten">' + n[0] + '</span>' + sao + '</div>'
        + (la ? '<div class="chi-tiet"><div class="dn">' + n[1] + '</div><div><span class="mo">Gợi ý tư vấn:</span> ' + n[2] + '</div>' + phu.map(p => '<div class="phu-nhom">' + p + '</div>').join('') + '</div>' : '') + '</div>';
    }).join('') + '</div></div>';
}

function nhanHm(h) {
  if (!h.cuoi && (h.con <= 1000 || h.denThang)) return '';
  if (h.con < -1000) return tag('Quá ' + tien(-h.con) + ' km', 'do');
  if (h.con <= 1000) return tag('Tới kỳ', 'cam');
  if (h.denThang) return tag('Đã ' + h.thangQua + ' tháng', 'cam');
  return tag('Còn ' + tien(h.con) + ' km');
}

function dongHm(h, i) {
  const ck = tien(h.ck) + ' km' + (h.thang ? ' hoặc ' + h.thang + ' tháng' : '') + (h.thang && h.ma === 'gl' ? ', nếu xe có mùi' : '');
  const d2 = h.cuoi ? 'Lần cuối ' + ngayVN(h.cuoi[0]) + ' ở ' + tien(h.cuoi[1]) + ' km, chu kỳ ' + ck
    : 'Chu kỳ ' + ck;
  // Dòng 1: tên, nhãn quá hạn, giá; dòng 2: câu lợi ích để CVDV nói với khách. Lần cuối, chu kỳ hiện khi rê chuột
  return '<div class="hm" title="' + esc(d2) + '"><div class="d1">' + (i != null ? '<span class="stt-hm">' + (i + 1) + '</span>' : '') + '<span class="ten">' + esc(h.ten) + '</span>' + nhanHm(h)
    + '<span class="gia so-lieu">' + tien(h.gia) + ' đ</span></div>' + (LOI_ICH[h.ma] ? '<div class="d2">' + LOI_ICH[h.ma] + '</div>' : '') + '</div>';
}

// "BD 58.000 Km" khi nhãn đã ghi BD → "58.000 Km"
const TIEN_TO = { 'BD': 'BD', 'SCC': 'SCC', 'Bảo hiểm': 'BH', 'Bảo hành': 'BH' };
const hoaDau = s => s.charAt(0).toUpperCase() + s.slice(1);
const boKmDau = nd => hoaDau(nd.replace(/^\d{1,3}(\.\d{3})+\s*km\b/i, '').replace(/^[\s,;:.+\-–]+/, '').replace(/^\(\s*([^()]*?)\s*\)$/, '$1')).replace(/\bKm\b/g, 'km');
const boTienTo = (nd, pl) => TIEN_TO[pl] ? hoaDau(nd.replace(new RegExp('^' + TIEN_TO[pl] + '\\s*[-–:;]?\\s*', 'i'), '')) || nd : nd;

/** Một lần vào xưởng = một dòng: ngày, km, loại lệnh, nội dung (GTGT đứng đầu, cắt bớt, đủ khi rê chuột), tiền. */
function dongLs(l, hienCn) {
  const khacCn = hienCn && l[1] !== META.chi_nhanh;
  const loai = l[3] === 'Đồng sơn tiền mặt' ? 'Đồng sơn' : l[3] === 'BD' && l[8] ? 'BD cấp ' + tenCap(l[8]) : l[3];
  const nd = (khacCn ? 'Tại ' + l[1] + '. ' : '') + boKmDau(boTienTo(l[6], l[3]));
  return '<div class="ls so-lieu" title="' + esc(nd) + '"><span>' + ngayVN(l[0]) + '</span><span class="mo r">' + tien(l[2]) + ' km</span>'
    + '<span' + (l[3] === 'BD' && !l[8] ? ' title="Chưa ghi cấp"' : '') + '>' + tag(esc(loai), l[3] === 'BD' ? 'bd' : '') + (l[7] === 'Chờ sửa' ? ' ' + tag('Chờ sửa', 'cam') : '') + '</span>'
    + '<span class="nd">' + (l[5] ? l[5].split(', ').map(t => tag(esc(t), '')).join(' ') + (nd ? ' ' : '') : '') + '<span class="mo">' + esc(nd) + '</span></span>'
    + '<span class="r">' + (l[4] ? tien(l[4]) + ' đ' : '<span class="dash">–</span>') + '</span></div>';
}

function veXe(x, kmNhap) {
  const d = deXuat(x, kmNhap), g = xepNhom(x, d.km);
  const phu = [];
  if (d.diIt) phu.push('Xe đi ít: xét thêm phụ gia, giàn lạnh, khử mùi theo tháng.');
  if (g.thieu && g.soBu === 0) phu.push('Có thể thiếu ' + g.thieu + ' lần bảo dưỡng, ma trận không cần bù (Mức 0): khách ký cam kết là tái kích hoạt được.');
  const kyVong = Math.round(x.bdu * META.ky_vong / 1e4) * 1e4;
  // Tái kích hoạt bảo hành: ghi trong dòng nhóm của khách
  if (g.nhom === 'tkh') {
    const ngoaiLe = g.muc === 2 ? ', hoặc 1 lần bảo dưỡng cấp lớn để có hiệu lực ngay' : g.muc === 3 ? ', hoặc bảo dưỡng cấp lớn và thêm 1 lần bảo dưỡng tiêu chuẩn' : '';
    phu.unshift('Ước tính thiếu ' + g.thieu + ' lần bảo dưỡng' + (d.uoc ? ' (km ước tính)' : '') + ': Mức ' + g.muc + ', bảo dưỡng bù ' + g.soBu + ' lần' + ngoaiLe
      + '. Tra DMS để chốt, quét lỗi GDS Mobile, lập biên bản giám định cho khách ký.');
  }

  // Khung "Tư vấn hôm nay": bảo dưỡng | GTGT, mỗi hạng mục một dòng; để kỳ sau gộp một dòng
  const ten = ds => ds.map(h => h.ten).join(', ');
  const gtgt = '<div class="muc"><div class="nhan-muc">GTGT khuyến nghị</div>'
    + '<div class="chinh so-lieu">' + (d.nay.length ? tien(d.tong) + ' đ <span class="mo phu-chinh">· ' + d.nay.length + ' hạng mục</span>' : '<span class="mo">Chưa có hạng mục tới kỳ</span>') + '</div>'
    + (d.nay.length ? '<div class="ds-hm">' + d.nay.map(dongHm).join('') + '</div>' : '')
    // Một dòng chú thích: để kỳ sau + kỳ vọng, trần
    + '<div class="chu-thich" title="Kỳ vọng bằng ' + Math.round(META.ky_vong * 100) + '% giá trị bảo dưỡng ước tính ' + trieu(x.bdu)
    + '. Giá tham khảo có VAT, trung vị tại ' + META.chi_nhanh + '. Rê chuột lên hạng mục để xem lần cuối và chu kỳ.">'
    + (d.sau.length || d.sap.length ? 'Để kỳ sau: ' + [d.sau.length ? ten(d.sau) + ' (vượt trần)' : '', d.sap.length ? 'sắp tới ' + ten(d.sap).toLowerCase() : ''].filter(Boolean).join('; ') + '. ' : '')
    + 'Kỳ vọng ≈ ' + tien(kyVong) + ' đ, trần ' + tien(META.tran) + ' đ.</div></div>';
  // Công việc cần làm sớm: phát hiện kỹ thuật KTV ghi (lốp, ắc quy, phanh…), tối đa 2 lần gần nhất trong 12 tháng, ngoài trần GTGT
  const dsLs = !x.lsm ? [] : Array.isArray(x.lsm[0]) ? x.lsm : [x.lsm];
  const lamSom = dsLs.length ? '<div class="lam-som"><span class="nhan">Công việc cần làm sớm:</span>'
    + dsLs.map(s => (dsLs.length > 1 ? '<br>• ' : ' ') + esc(s[1]) + ' <span class="ngay">(ghi ngày ' + ngayVN(s[0]) + ')</span>').join('') + '</div>' : '';
  const tuVan = '<div class="card noi-bat"><h2 class="card-title">Tư vấn hôm nay</h2><div class="hai-muc">' + veCap(capBD(x, d.km, kmNhap), d, g) + gtgt + '</div>' + lamSom + '</div>';

  XE = x;
  return '<div class="ket-qua ba-cot"><div>' + veKhach(x, d, g, phu) + (x.nb ? veNb(x.nb) : '') + '</div><div>' + tuVan + veHanhTrinh(x, d)
    + '<div class="card" id="lich-su">' + veLs(x, false) + '</div></div><div>' + veCongCu(x, d) + '</div></div>';
}

/** Cột công cụ: mỗi hạng mục GTGT một biểu tượng; hạng mục khuyến nghị hôm nay tô đậm kèm số thứ tự như danh sách;
 *  rê chuột hiện làm gì, tác dụng, nên làm khi, định kỳ, giá và tình trạng của xe này. */
function veCongCu(x, d) {
  const muc = META.hang_muc.map((h, i) => {
    const stt = d.nay.findIndex(n => n.ma === h.ma);
    const cuoi = x.hm[h.ma];
    const sau = d.sau.some(n => n.ma === h.ma), sap = d.sap.some(n => n.ma === h.ma), ko = h.ma === 'bl' && !x.bl;
    const tt = stt >= 0 ? 'Khuyến nghị hôm nay (số ' + (stt + 1) + ')' : sau ? 'Đã tới kỳ, để kỳ sau vì vượt trần'
      : sap ? 'Sắp tới kỳ' : ko ? 'Không áp dụng cho model này' : 'Chưa tới kỳ';
    // Tình trạng trên biểu tượng: khuyến nghị tô đậm; để kỳ sau, sắp tới viền xanh; không áp dụng mờ
    const lop = stt >= 0 ? ' nay' : sau || sap ? ' cho' : ko ? ' ko' : '';
    const mt = MO_TA[h.ma] || ['', ''];
    const tip = '<div class="tip"><div class="t1"><span>' + esc(TEN_DAY[h.ma] || h.ten) + '</span><span class="gia so-lieu">' + tien(h.gia) + ' đ</span></div>'
      + (mt[0] ? '<div class="dong"><b>Làm gì:</b> ' + mt[0] + '</div>' : '')
      + (LOI_ICH[h.ma] ? '<div class="dong"><b>Tác dụng:</b> ' + LOI_ICH[h.ma] + '</div>' : '')
      + (mt[1] ? '<div class="dong"><b>Nên làm khi:</b> ' + mt[1] + '</div>' : '')
      + '<div class="dong so-lieu"><b>Định kỳ:</b> ' + tien(h.ck) + ' km' + (h.thang ? ', xe đi ít ' + h.thang + ' tháng' : '') + '</div>'
      + '<div class="xe-nay so-lieu"><b>Xe này:</b> ' + (cuoi ? 'lần cuối ' + ngayVN(cuoi[0]) + ' ở ' + tien(cuoi[1]) + ' km' : 'chưa ghi nhận từ 01/2025') + '. ' + tt + '.</div></div>';
    return '<div class="cc-muc' + lop + (i >= META.hang_muc.length - 3 ? ' duoi' : '') + '"><span class="bt">' + (BT_HM[h.ma] || '') + '</span>'
      + (stt >= 0 ? '<span class="stt">' + (stt + 1) + '</span>' : '') + '<span class="ten">' + esc(h.ten) + '</span>' + tip + '</div>';
  }).join('');
  return '<div class="card cong-cu"><div class="nhan-muc">GTGT</div>' + muc + '</div>';
}

/** Hành trình km: các lần vào xưởng đặt theo km trên một trục; bảo dưỡng phía trên, lần khác phía dưới; mốc hôm nay.
 *  Nhãn gần nhau thì xếp tầng (tối đa 3 tầng mỗi phía). */
function veHanhTrinh(x, d) {
  const ds = x.ls.filter(l => l[2] > 0).slice().reverse();
  if (!ds.length) return '';
  // Trục bắt đầu gần lần vào đầu tiên (xe km cao không dồn về bên phải); gần 0 thì lấy từ 0
  const max = Math.max(d.km, ...ds.map(l => l[2])) * 1.04, min = Math.min(...ds.map(l => l[2]));
  const buoc = [1000, 2000, 5000, 10000, 20000, 25000, 50000].find(b => (max - min) / b <= 9) || 100000;
  let goc = Math.floor(min / buoc) * buoc; if (goc <= 2 * buoc) goc = 0;
  const tran = Math.ceil(max / buoc) * buoc;
  const vt = k => Math.min(97, Math.max(3, (k - goc) / (tran - goc) * 100));
  const LOP = { 'Bảo hành': 'bh', 'Bảo hiểm': 'bhi', 'Đồng sơn tiền mặt': 'ds' };
  const TEN = { 'Bảo hành': 'Bảo hành', 'Bảo hiểm': 'Bảo hiểm', 'Đồng sơn tiền mặt': 'Đồng sơn' };
  const RONG = 12, CAO = 38;  // nhãn rộng khoảng 12% trục; mỗi tầng cao 36px
  const xep = arr => { const cuoi = []; return arr.map(o => { let t = cuoi.findIndex(p => o.v - p >= RONG); if (t < 0) t = cuoi.length < 3 ? cuoi.length : cuoi.indexOf(Math.min(...cuoi)); cuoi[t] = o.v; return Object.assign(o, { t }); }); };
  const tren = xep(ds.filter(l => l[3] === 'BD').map(l => ({ l, v: vt(l[2]), lop: l[7] === 'Chờ sửa' ? 'cho' : 'bd',
    ten: l[7] === 'Chờ sửa' ? 'BD chờ sửa' : l[8] ? 'Cấp ' + tenCap(l[8]) : 'BD' }))
    .concat([{ v: vt(d.km), lop: 'nay', ten: 'Hôm nay', km: d.km }]).sort((a, b) => a.v - b.v));
  const duoi = xep(ds.filter(l => l[3] !== 'BD').map(l => ({ l, v: vt(l[2]), lop: LOP[l[3]] || '', ten: TEN[l[3]] || l[3] })));
  const nT = Math.max(1, ...tren.map(o => o.t + 1)), nD = duoi.length ? Math.max(...duoi.map(o => o.t + 1)) : 0;
  const A = nT * CAO + 6, H = A + 22 + nD * CAO;
  const the = (o, top, noiTop, noiCao) => {
    const l = o.l, km = l ? l[2] : o.km;
    const tt = l ? ngayVN(l[0]) + ' · ' + tien(l[2]) + ' km · ' + (l[3] === 'BD' && l[8] ? 'BD cấp ' + tenCap(l[8]) : l[3]) + (l[7] === 'Chờ sửa' ? ' (chờ sửa)' : '')
      + (l[4] ? ' · ' + tien(l[4]) + ' đ' : '') + (l[6] ? '\n' + l[6] : '') : 'Km hôm nay' + (d.uoc ? ' (ước tính)' : '') + ': ' + tien(d.km);
    return '<div class="noi' + (o.lop === 'nay' ? ' nay' : '') + '" style="left:' + o.v + '%;top:' + noiTop + 'px;height:' + noiCao + 'px"></div>'
      + (o.lop !== 'nay' ? '<div class="cham ' + o.lop + '" style="left:' + o.v + '%;top:' + (A - 3) + 'px"></div>' : '')
      + '<div class="the so-lieu ' + o.lop + '" style="left:' + o.v + '%;top:' + top + 'px" title="' + esc(tt) + '">' + esc(o.ten) + '<span class="k">' + tien(km) + ' km</span></div>';
  };
  let h = '<div class="truc" style="top:' + A + 'px"></div>';
  for (let k = goc; k <= tran; k += buoc) {
    const p = (k - goc) / (tran - goc) * 100;
    h += '<div class="vach" style="left:' + p + '%;top:' + (A + 2) + 'px"></div><div class="so-vach so-lieu" style="left:' + p + '%;top:' + (A + 6) + 'px">' + (k ? tien(k / 1000) + 'k' : '0') + '</div>';
  }
  tren.forEach(o => { const top = A - (o.t + 1) * CAO; h += the(o, top, top + 30, A - top - 30); });
  duoi.forEach(o => { const top = A + 24 + o.t * CAO; h += the(o, top, A + 2, top - A - 2); });
  return '<div class="card hanh-trinh"><div class="dau-card"><h2 class="card-title">Hành trình km</h2>'
    + '<span class="chu-thich" style="margin:0">Bảo dưỡng ở trên trục, các lần vào khác ở dưới; rê chuột để xem chi tiết</span></div>'
    + '<div class="ht" style="height:' + H + 'px">' + h + '</div></div>';
}

/** Lịch sử: mặc định 5 lần gần nhất + "Xem thêm"; lọc Bảo dưỡng thì hiện đủ mọi lần BD. */
function veLs(x, chiBD) {
  const hienCn = new Set(x.ls.map(l => l[1])).size > 1;
  const bd = x.ls.filter(l => l[3] === 'BD');
  const ds = chiBD ? bd : x.ls;
  const nut = (loc, ten, so) => '<button data-loc="' + loc + '" class="' + ((loc === 'bd') === chiBD ? 'on' : '') + '">' + ten + ' ' + so + '</button>';
  let h = '<div class="dau-card dau-ls"><h2 class="card-title">Lịch sử vào xưởng</h2><div class="loc">' + nut('tat', 'Tất cả', x.ls.length) + nut('bd', '<span class="dai">Bảo dưỡng</span><span class="ngan">BD</span>', bd.length) + '</div></div>';
  if (!ds.length) return h + '<p class="mo">Chưa có lần bảo dưỡng nào từ 01/2025.</p>';
  // Bình quân theo bộ lọc đang chọn (tiền gồm cả GTGT trong lệnh); số lần, tổng đã có ở ô Vào xưởng
  const tong = ds.reduce((s, l) => s + l[4], 0);
  h += '<div class="dong-phu so-lieu">Bình quân ' + trieu(tong / ds.length) + ' mỗi lần' + (chiBD ? ' bảo dưỡng' : '') + '</div>';
  const dau = chiBD ? ds : ds.slice(0, SO_LS_HIEN), con = chiBD ? [] : ds.slice(SO_LS_HIEN);
  return h + '<div class="ls dau-bang"><span>Ngày</span><span class="r">Km</span><span>Loại</span><span>Ghi chú</span><span class="r">Chi phí</span></div>'
    + '<div class="ds-ls">' + dau.map(l => dongLs(l, hienCn)).join('') + '</div>'
    + (con.length ? '<details><summary><span class="lien">Xem thêm ' + con.length + ' lần</span></summary>'
      + '<div class="ds-ls">' + con.map(l => dongLs(l, hienCn)).join('') + '</div></details>' : '');
}

// ---------- Lễ tân DV ----------
const LT = { ds: [], loc: 'tat', mo: new Set(), hen: null, lh: null, henToi: false };

async function ltGoi(ham, ...thamSo) {
  $('lt-loi').textContent = '';
  try { return await goi(ham, PHIEN.token, ...thamSo); }
  catch (e) {
    if (e.message.includes('HET_PHIEN')) { thoat(); $('loi-dn').textContent = 'Hết phiên làm việc, đăng nhập lại.'; }
    else $('lt-loi').textContent = e.message;
    return null;
  }
}

async function ltTai() {
  // Lịch hẹn đọc riêng, lỗi (chưa Deploy bản có ltHen, chưa có thư mục) thì bỏ qua, không báo lễ tân
  const [ds, lh] = await Promise.all([ltGoi('ltDanhSach'), goi('ltHen', PHIEN.token).catch(() => LT.lh)]);
  LT.lh = lh || null;
  if (ds) { LT.ds = ds; veLt(); } else veHen();
}

async function ltThem(bien) {
  bien = bien || $('lt-bien').value;
  if (!bien.trim()) return;
  $('lt-them').disabled = true; $('lt-goi-y').innerHTML = '';
  const r = await ltGoi('ltThem', bien);
  $('lt-them').disabled = false;
  if (!r) return;
  if (r.goiY) {
    $('lt-goi-y').innerHTML = '<div class="dong-phu">Nhiều xe khớp, chọn biển số:</div>' + r.goiY.map(b => '<button class="btn" data-lt-b="' + esc(b) + '">' + esc(b) + '</button>').join('');
    return;
  }
  $('lt-bien').value = '';
  LT.loc = 'tat';
  await ltTai();
}

/** Mỗi khách một hàng gọn: biển số (model · giờ vào) | khuyến nghị 1, 2 | ô chọn CVDV nhận.
 *  Bấm biển số mở chi tiết: tên khách, 5 lần vào xưởng gần nhất (ngày, loại, km, CVDV), xóa dòng nhập nhầm. */
const phutLt = s => { const m = /^(\d{1,2}):(\d{2})/.exec(String(s || '')); return m ? +m[1] * 60 + +m[2] : null; };
// Phút hiện tại trong ngày (bản demo đặt LT.gioNay để cố định giờ)
const phutNay = () => LT.gioNay ? phutLt(LT.gioNay) : new Date().getHours() * 60 + new Date().getMinutes();
/** Số phút chờ: đã nhận = giờ nhận − giờ vào; chưa nhận = bây giờ − giờ vào. */
const choLt = r => Math.max(0, (r.cvdv ? phutLt(r.gioNhan) : phutNay()) - phutLt(r.gio));

function veLt() {
  veHen();
  const nhan = LT.ds.filter(r => r.cvdv).length, chua = LT.ds.length - nhan, NG = META.choLau || 20;
  // Tóm tắt: chờ trung bình của xe đã nhận, số xe chờ quá ngưỡng (gồm cả xe đang chờ)
  const daNhan = LT.ds.filter(r => r.cvdv).map(choLt), lau = LT.ds.filter(r => choLt(r) > NG).length;
  $('lt-tom').innerHTML = LT.ds.length ? 'Chờ CVDV nhận TB <b>' + (daNhan.length ? Math.round(daNhan.reduce((s, v) => s + v, 0) / daNhan.length) + ' phút' : '–') + '</b>'
    + ' · <span class="' + (lau ? 'do' : '') + '">' + lau + ' xe chờ quá ' + NG + ' phút</span>' : '';
  const nut = (loc, ten, so) => '<button data-lt-loc="' + loc + '" class="' + (LT.loc === loc ? 'on' : '') + '">' + ten + ' ' + so + '</button>';
  $('lt-loc').innerHTML = nut('tat', 'Tất cả', LT.ds.length) + nut('chua', 'Chưa nhận', chua) + nut('nhan', 'Đã nhận', nhan);
  const ds = LT.ds.filter(r => LT.loc === 'tat' || (LT.loc === 'nhan') === !!r.cvdv).slice().reverse();
  if (!ds.length) { $('lt-ds').innerHTML = '<p class="mo">' + (LT.ds.length ? 'Không có khách trong mục này.' : 'Chưa có khách hôm nay. Nhập biển số khi khách tới.') + '</p>'; return; }
  // Khách hẹn (biển số trùng lịch hẹn hôm nay): mọi khách hẹn đã tới đều nền xanh nhạt (người dùng chốt 13/11/2026: trễ hay đúng
  // giờ đã xảy ra rồi); tới không quá giờ hẹn + HEN_TRE_PHUT → nhãn "Hẹn hh:mm", tới trễ hơn → nhãn cam "Trễ hẹn 1 giờ 12 phút"
  const henB = {};
  ((LT.lh || {}).ds || []).forEach(x => henB[gonBien(x.b)] = x.gio);
  $('lt-ds').innerHTML = '<div class="lt-ds">' + ds.map(r => {
    const hen = henB[gonBien(r.b)], treHen = hen != null ? phutLt(r.gio) - phutLt(hen) : 0, dungHen = hen != null && treHen <= henTre();
    const knTen = r.kn.map(k => k.split(' ')[0]);
    // "TruongNV (5/5)" → tên + số lần nhạt
    const knHien = k => esc(k.split(' ')[0]) + ' <span class="so">' + esc((k.split(' ')[1] || '').replace(/[()]/g, '')) + '</span>';
    // Ô chọn: khuyến nghị đứng đầu, sau đó các CVDV còn lại
    const tuy = knTen.concat(META.cvdv.filter(c => knTen.indexOf(c) < 0));
    const chon = '<select data-lt-id="' + esc(r.id) + '"' + (r.cvdv ? ' class="co"' : '') + '><option value="">Chọn CVDV</option>'
      + tuy.map(c => '<option' + (c === r.cvdv ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select>';
    const mo = LT.mo.has(r.id);
    const ct = mo ? '<div class="lt-ct">' + (r.kh ? '<div class="kh">' + esc(chuanTen(r.kh)) + '</div>' : '')
      + (r.cvdv ? '<div class="kh mo">Vào ' + esc(r.gio) + ', CVDV nhận ' + esc(r.gioNhan) + '</div>' : '')
      + (r.ls.length ? r.ls.map(l => '<div class="dong so-lieu"><span class="mo">' + ngayVN(l[0]) + '</span><span>' + esc(l[2])
        + (l[1] ? ' <span class="mo">· ' + tien(l[1]) + ' km</span>' : '') + '</span><span>' + (esc(l[3]) || '<span class="dash">–</span>') + '</span></div>').join('')
        : '<div class="mo">Chưa có lịch sử từ 01/2025.</div>')
      + '<button class="xoa" data-lt-xoa="' + esc(r.id) + '">Xóa khỏi danh sách (nhập nhầm)</button></div>' : '';
    const model = (MODEL[(r.m || '').toLowerCase().replace(/\s+/g, '')] || [chuanModel(r.m)])[0];
    // Chưa nhận mà chờ quá ngưỡng: nhãn đỏ nhỏ cạnh biển số với số phút đang chờ
    const cho = choLt(r), lau = !r.cvdv && cho > (META.choLau || 20);
    return '<div class="lt-h' + (hen != null ? ' co-hen' : '') + '"><div class="xe-lt" data-lt-ct="' + esc(r.id) + '"><div class="bien' + (hen != null ? ' co-tag' : '') + '">' + esc(r.b)
      + (dungHen ? tag('Hẹn ' + esc(hen), 'bd') : hen != null ? tag('Trễ hẹn ' + phutDu(treHen), 'cam') : '') + '</div>'
      // Đã nhận: giờ vào · số phút chờ (giờ nhận, model xem trong chi tiết); chưa nhận quá ngưỡng: số phút đang chờ chữ đỏ thay model
      + '<div class="phu so-lieu">' + esc(r.gio) + (r.cvdv ? ' · ' + cho + ' phút' : lau ? ' · <span class="t-do">' + cho + ' phút</span>' : model ? ' · ' + esc(model) : '') + '</div></div>'
      + '<div class="kn">' + (r.kn.length ? '<div class="kn1">' + knHien(r.kn[0]) + '</div>' + (r.kn[1] ? '<div class="kn2">' + knHien(r.kn[1]) + '</div>' : '')
        : '<div class="kn2">Khách mới</div>') + '</div>'
      + chon + ct + '</div>';
  }).join('') + '</div>';
}

/** Khách hẹn hôm nay (NT): chưa tới xếp theo giờ hẹn, quá giờ hẹn META tre phút thì số phút trễ chữ đỏ; nút "Khách tới" thêm xe
 *  vào danh sách (CVDV hẹn thành khuyến nghị 1). Đã tới (biển số có trong danh sách hôm nay) thu sau liên kết "Xem thêm".
 *  Bấm biển số mở tên khách, số điện thoại (bấm để gọi), model, khung giờ hẹn, nội dung đầy đủ. */
function veHen() {
  const el = $('lt-hen'), h = LT.lh;
  el.hidden = !h;
  if (!h) { el.innerHTML = ''; return; }
  const vao = {};
  LT.ds.forEach(r => { const k = gonBien(r.b); if (!vao[k] || r.gio < vao[k]) vao[k] = r.gio; });
  // Đã tới: có trong danh sách hôm nay (giờ vào), hoặc DMS đã tiếp nhận (AppStatus 3 / có phiếu, người dùng chốt 17/11/2026)
  // dù lễ tân chưa nhập trên màn hình này: ghi "Đã tiếp nhận", không tính trễ
  const ds = h.ds.map(x => Object.assign({}, x, { toi: vao[gonBien(x.b)] || '', dms: !vao[gonBien(x.b)] && (x.st === '3' || !!x.tn) }))
    .map(x => Object.assign(x, { toi: x.toi || (x.dms ? 'DMS' : '') })).sort((a, b) => a.gio < b.gio ? -1 : a.gio > b.gio ? 1 : 0);
  const nay = phutNay(), treNay = x => phutLt(x.gio) != null && nay - phutLt(x.gio) > henTre();
  // Chưa tới: hẹn còn trong giờ lên trước (ưu tiên đúng giờ), hẹn đã trễ xuống sau
  const chua = ds.filter(x => !x.toi && !treNay(x)).concat(ds.filter(x => !x.toi && treNay(x))), toi = ds.filter(x => x.toi);
  const homNay = new Date(Date.now() + 7 * 36e5).toISOString().slice(0, 10);
  const dong = x => {
    const id = 'h' + x.so + x.b, tre = !x.toi && phutLt(x.gio) != null ? nay - phutLt(x.gio) : 0;
    // Nền xanh nhạt: đã tới (đúng giờ hay trễ), hoặc chưa tới và chưa quá giờ hẹn + HEN_TRE_PHUT
    const dung = x.dms ? true : x.toi ? phutLt(x.toi) - phutLt(x.gio) <= henTre() : tre <= henTre();
    const model = (MODEL[(x.m || '').toLowerCase().replace(/\s+/g, '')] || [chuanModel(x.m)])[0];
    const ct = LT.mo.has(id) ? '<div class="lt-ct">' + (x.kh ? '<div class="kh">' + esc(chuanTen(x.kh)) + '</div>' : '')
      + (x.dt ? '<div class="kh"><a href="tel:' + esc(x.dt.replace(/[^0-9+]/g, '')) + '">' + esc(x.dt) + '</a></div>' : '')
      + '<div class="kh mo">' + esc([model, 'hẹn ' + x.gio + (x.den ? '–' + x.den : '')].filter(Boolean).join(', ')) + '</div>'
      + (x.nd ? '<div class="kh">' + esc(x.nd) + '</div>' : '')
      + (!x.cv && x.cvTen ? '<div class="kh mo">CVDV hẹn ' + esc(x.cvTen) + '</div>' : '') + '</div>' : '';
    return '<div class="lt-h' + (dung || x.toi ? ' co-hen' : '') + '"><div class="xe-lt" data-lt-ct="' + esc(id) + '"><div class="bien">' + esc(x.b) + '</div>'
      + '<div class="phu so-lieu">' + esc(x.gio) + (tre > henTre() ? ' · <span class="t-do">trễ ' + phutChu(tre) + '</span>'
        : x.toi && !dung ? ' · tới trễ ' + phutChu(phutLt(x.toi) - phutLt(x.gio)) : x.nd ? ' · ' + esc(x.nd) : '') + '</div></div>'
      + '<div class="kn">' + (x.cv ? '<div class="kn1">' + esc(x.cv) + '</div>' : '<div class="kn2">Chưa hẹn CVDV</div>') + '</div>'
      + (x.dms ? '<div class="tg">Đã tiếp nhận</div>' : x.toi ? '<div class="tg so-lieu">Tới ' + esc(x.toi) + '</div>' : '<button class="btn" data-hen-toi="' + esc(x.b) + '">Khách tới</button>') + ct + '</div>';
  };
  const cu = h.ngay !== homNay ? ', chưa có file hôm nay' : '';
  el.innerHTML = '<div class="hen-khung"><div class="hen-dau"><h2>Khách hẹn hôm nay</h2><span class="so-lieu">' + (ds.length ? chua.length + ' chưa tới, ' + toi.length + ' đã tới · ' : '')
    + 'lịch cập nhật ' + esc(h.gio) + (h.ngay !== homNay ? ' ' + ngayVN(h.ngay).slice(0, 5) : '') + cu + '</span></div>'
    + (!ds.length ? '<p class="mo">Không có khách hẹn hôm nay.</p>'
      : (chua.length ? chua.map(dong).join('') : '<p class="mo">Khách hẹn đã tới hết.</p>')
        + (LT.henToi ? toi.map(dong).join('') : '')
        + (toi.length ? '<a href="#" class="hen-them" data-hen-xem>' + (LT.henToi ? 'Ẩn khách hẹn đã tới' : 'Xem ' + toi.length + ' khách hẹn đã tới') + '</a>' : '')) + '</div>';
}
// Thời lượng gọn cho màn hình điện thoại: 45 → "45 phút", 331 → "5 giờ"
const phutChu = n => n < 60 ? n + ' phút' : Math.floor(n / 60) + ' giờ';
// Thời lượng đủ (chỗ rộng): 72 → "1 giờ 12 phút"
const phutDu = n => n < 60 ? n + ' phút' : Math.floor(n / 60) + ' giờ' + (n % 60 ? ' ' + n % 60 + ' phút' : '');
const henTre = () => (LT.lh && LT.lh.tre) || 30;
const gonBien = s => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-hen-xem]')) { e.preventDefault(); LT.henToi = !LT.henToi; veHen(); }
  else if (t.closest('[data-hen-toi]')) ltThem(t.closest('[data-hen-toi]').dataset.henToi);
  else if (t.closest('[data-lt-loc]')) { LT.loc = t.closest('[data-lt-loc]').dataset.ltLoc; veLt(); }
  else if (t.closest('[data-lt-ct]')) { const id = t.closest('[data-lt-ct]').dataset.ltCt; LT.mo.has(id) ? LT.mo.delete(id) : LT.mo.add(id); veLt(); }
  else if (t.closest('[data-lt-b]')) ltThem(t.closest('[data-lt-b]').dataset.ltB);
  else if (t.closest('[data-lt-xoa]') && confirm('Xóa khách này khỏi danh sách hôm nay?')) ltGoi('ltXoa', t.closest('[data-lt-xoa]').dataset.ltXoa).then(ds => { if (ds) { LT.ds = ds; veLt(); } });
});
document.addEventListener('change', async e => {
  const s = e.target.closest('[data-lt-id]');
  if (!s) return;
  s.disabled = true;
  const ds = await ltGoi('ltNhan', s.dataset.ltId, s.value);
  if (ds) { LT.ds = ds; veLt(); } else s.disabled = false;
});
// ---------- Tổng hợp: Lễ tân DV | Công việc cần làm sớm ----------
const BC = { cn: null, muc: null };   // muc: 'lt' Lễ tân, 'ls' Công việc cần làm sớm, 'nb' Nhắc bảo dưỡng

/** Mốc kế tiếp theo README mục 2 (26. Nhac bao duong): tin 1 ở tới hạn − 15, tin 2 ở tới hạn, gọi ở tới hạn + 15 và ≥ 15 ngày sau tin cuối. */
function mocKeTiep(n) {
  if (n.viec[0] === 'xong' || !/^A/.test(n.nhom) || n.goi) return '';
  const tin = (n.tin || []).filter(t => t[1] !== 'Đại lý tự gửi trước đây');
  const cong = (s, so) => { const d = new Date(s); d.setUTCDate(d.getUTCDate() + so); return d.toISOString().slice(0, 10); };
  if (!tin.length) return n.nhan ? 'Tin 1: tuần có ngày ' + ngayVN(n.nhan) : '';
  if (tin.length === 1 && tin[0][1] === 'Nhắc trước kỳ' && n.han) return 'Tin 2: tuần có ngày tới hạn ' + ngayVN(n.han);
  const cuoi = tin[tin.length - 1][0], moc = n.han && n.han > cuoi ? n.han : cuoi;
  return 'Gọi: từ ' + ngayVN(cong(moc, 15)) + ' nếu khách chưa quay lại';
}

const DV_BH_MAU = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
let DV_BH = { boNgap: true, d: null };

/** Treemap chia ô theo tỷ lệ (thuật toán squarified): ds [{ten, v}] giảm dần → [{ten, v, x, y, w, h}] theo % khung. */
function chiaO(ds, x, y, w, h) {
  const tong = ds.reduce((s, o) => s + o.v, 0), ra = [];
  let con = ds.map(o => Object.assign({}, o, { a: o.v / tong * w * h }));
  const xau = (hang, canh) => { const s = hang.reduce((a, o) => a + o.a, 0), mx = Math.max(...hang.map(o => o.a)), mn = Math.min(...hang.map(o => o.a));
    return Math.max(canh * canh * mx / (s * s), s * s / (canh * canh * mn)); };
  while (con.length) {
    const canh = Math.min(w, h);
    let hang = [con[0]], i = 1;
    while (i < con.length && xau(hang.concat([con[i]]), canh) <= xau(hang, canh)) { hang.push(con[i]); i++; }
    con = con.slice(i);
    const s = hang.reduce((a, o) => a + o.a, 0), day = s / canh;
    let p = 0;
    hang.forEach(o => {
      const dai = o.a / day;
      ra.push(w >= h ? Object.assign(o, { x: x, y: y + p, w: day, h: dai }) : Object.assign(o, { x: x + p, y: y, w: dai, h: day }));
      p += dai;
    });
    if (w >= h) { x += day; w -= day; } else { y += day; h -= day; }
  }
  return ra;
}

function veBh() {

  const mau = {}; ds.slice().sort((a, b) => (tong(b) - ngap(b)) - (tong(a) - ngap(a))).forEach((r, i) => { mau[r[0]] = i < DV_BH_MAU.length ? DV_BH_MAU[i] : '#9aa1ad'; });
  const o = ds.map(r => ({ ten: r[0], v: DV_BH.boNgap ? tong(r) - ngap(r) : tong(r), r: r })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const sum = o.reduce((s, x) => s + x.v, 0);
  $('dv-bh-loc').innerHTML = [[true, 'Bỏ xe ngập nước'], [false, 'Tất cả']].map(([k, ten]) => '<button data-bh="' + k + '" class="' + (k === DV_BH.boNgap ? 'on' : '') + '">' + ten + '</button>').join('');
  if (!sum) { $('dv-bh').innerHTML = '<p class="mo">Không có doanh thu bảo hiểm.</p>'; return; }
  const xs = Object.keys(d.dt_loai || {}).length > 1;
  $('dv-bh').innerHTML = '<div class="dv-tm">' + chiaO(o, 0, 0, 1000, 260).map(c => {   // khung ~1300 x 340 px: chia theo tỷ lệ đó rồi đổi ra %
    const pt = Math.round(c.v / sum * 1000) / 10, nho = c.w < 60 || c.h < 30;
    const tach = xs ? ' (' + Object.entries(c.r[1]).map(([x, v]) => DV_TEN_X[x] + ' ' + trD(v - ((c.r[2] || {})[x] || 0) * DV_BH.boNgap)).join(', ') + ')' : '';

      + esc(c.ten) + ': ' + trD(c.v) + ' tr, ' + pt.toLocaleString('vi-VN') + '%' + esc(tach) + '">'
      + (nho ? '' : '<span>' + esc(c.ten) + '</span><b>' + Math.round(pt) + '%</b>') + '</div>';
  }).join('') + '</div>'
    + '<div class="bc-chu">Tổng ' + trD(sum) + ' tr (chưa VAT), lệnh loại Bảo hiểm thanh toán từ ' + ngayVN(d.bh_tu) + ' đến ' + ngayVN(d.chot) + ', theo công ty bảo hiểm ghi trên lệnh (Master Data, cột "Chi tiết BH"). '
    + 'Xe ngập nước trong kỳ: ' + trD(o.length ? ds.reduce((s, r) => s + ngap(r), 0) : 0) + ' tr. Rê chuột lên ô để xem số tiền' + (xs ? ', tách Đà Lạt / Bảo Lộc' : '') + '.</div>';
}


/** Cột một chuỗi theo tháng, có số trên đầu cột: mỗi tổ một biểu đồ, trục riêng (so với các tháng trước của tổ). */
function bdTo(nhan, gt, mau, tip) {
  const W = 520, H = 130, l = 4, r = 4, t = 18, b = 22, n = nhan.length || 1;
  const max = Math.max(1, ...gt) * 1.05, y = v => t + (H - t - b) * (1 - v / max), rong = (W - l - r) / n, bw = Math.min(36, rong - 12);
  let s = '<svg class="dv-bd" viewBox="0 0 ' + W + ' ' + H + '" role="img"><line class="luoi" x1="' + l + '" x2="' + (W - r) + '" y1="' + (H - b) + '" y2="' + (H - b) + '"/>';
  gt.forEach((v, i) => {
    const cx = l + i * rong + rong / 2;
    if (v) s += '<rect x="' + (cx - bw / 2) + '" y="' + y(v) + '" width="' + bw + '" height="' + (H - b - y(v)) + '" rx="3" fill="' + mau + '"><title>' + tip(i) + '</title></rect>'
      + '<text class="so" x="' + cx + '" y="' + (y(v) - 6) + '" text-anchor="middle">' + Math.round(v / 1e6).toLocaleString('vi-VN') + '</text>';
    s += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + nhan[i] + '</text>';
  });
  return s + '</svg>';
}

/** Thanh ngang top 10 (như Power BI DV): biển số | thanh | giá trị (triệu); rê chuột xem loại, nội dung, trạng thái. */
function bdNgang(ds, bien, tip) {
  if (!ds.length) return '<p class="mo">Không có.</p>';
  const max = Math.max(...ds.map(b => b.tien)) || 1;
  return '<div class="dv-ngang">' + ds.map((b, i) => '<div class="stt">' + (i + 1) + '</div><div class="bs">' + bien(b) + '</div><div class="cot" title="' + esc(tip(b)) + '"><i style="width:calc((100% - 44px) * ' + (b.tien / max).toFixed(3) + ')"></i><span>'
    + Math.round(b.tien / 1e6).toLocaleString('vi-VN') + '</span></div>').join('') + '</div>';
}

/** Doanh thu theo tháng: cột xếp chồng theo xưởng, số tổng trên đầu cột (triệu), vạch ngang chỉ tiêu tháng; tooltip từng cột. */
function bdThang(hang, mau, ct) {
  const W = 720, H = 220, l = 44, r = 8, t = 22, b = 26, n = hang.length || 1;
  const tong = h => h.gt.reduce((s, v) => s + v, 0);
  const max = Math.max(1, ...hang.map(tong), ...hang.map(h => ct[h.th] || 0)) * 1.06;
  const y = v => t + (H - t - b) * (1 - v / max), rong = (W - l - r) / n, bw = Math.min(40, rong - 12);
  let s = '<svg class="dv-bd" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  [0, .25, .5, .75, 1].forEach(k => { const v = max / 1.06 * k; s += '<line class="luoi" x1="' + l + '" x2="' + (W - r) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (l - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + Math.round(v / 1e6).toLocaleString('vi-VN') + '</text>'; });
  hang.forEach((h, i) => {
    const cx = l + i * rong + rong / 2, c = ct[h.th];
    let dinh = H - b;
    h.gt.forEach((v, k) => {
      if (!v) return;
      const cao = (H - t - b) * v / max;
      s += '<rect x="' + (cx - bw / 2) + '" y="' + (dinh - cao + (k ? 1 : 0)) + '" width="' + bw + '" height="' + Math.max(0, cao - (k ? 1 : 0)) + '" rx="2" fill="' + (mau[k] || 'var(--accent)') + '"><title>' + (h.tips ? h.tips[k] : h.tip) + '</title></rect>';
      dinh -= cao;
    });
    if (c) s += '<line x1="' + (cx - bw / 2 - 5) + '" x2="' + (cx + bw / 2 + 5) + '" y1="' + y(c) + '" y2="' + y(c) + '" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 2"><title>Chỉ tiêu ' + trD(c) + ' tr</title></line>';
    s += '<text class="so" x="' + cx + '" y="' + (Math.min(y(tong(h)), c ? y(c) : 1e9) - 6) + '" text-anchor="middle">' + Math.round(tong(h) / 1e6).toLocaleString('vi-VN') + '</text>'
      + '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + h.nhan + '</text>';
  });
  return s + '</svg>';
}

/** Biểu đồ cột (xếp chồng theo xưởng) + đường ngang tham chiếu; mỗi cột có tooltip. hang: [{nhan, gt: [..theo xưởng], tip}] */
function bdCot(hang, xs, ref, refTen) {
  const W = 720, H = 200, l = 44, r = 8, t = 10, b = 26, n = hang.length || 1;
  const max = Math.max(1, ref || 0, ...hang.map(h => h.gt.reduce((s, v) => s + v, 0))) * 1.08;
  const y = v => t + (H - t - b) * (1 - v / max), bw = Math.max(2, (W - l - r) / n - 3);
  const nac = [0, .25, .5, .75, 1].map(k => max / 1.08 * k);
  let s = '<svg class="dv-bd" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  nac.forEach(v => { s += '<line class="luoi" x1="' + l + '" x2="' + (W - r) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (l - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + (v >= 1e6 ? trD(v) : Math.round(v)) + '</text>'; });
  hang.forEach((h, i) => {
    const x = l + i * (W - l - r) / n + 1.5;
    let dinh = H - b;
    h.gt.forEach((v, k) => {
      if (!v) return;
      const cao = (H - t - b) * v / max;
      s += '<rect x="' + x + '" y="' + (dinh - cao + (k ? 1 : 0)) + '" width="' + bw + '" height="' + Math.max(0, cao - (k ? 1 : 0)) + '" rx="2" fill="' + (DV_MAU[xs[k]] || 'var(--accent)') + '"><title>' + h.tip + '</title></rect>';
      dinh -= cao;
    });
    if (n <= 31 || i % 3 === 0) s += '<text x="' + (x + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + h.nhan + '</text>';
  });
  if (ref) s += '<line x1="' + l + '" x2="' + (W - r) + '" y1="' + y(ref) + '" y2="' + y(ref) + '" stroke="var(--hint)" stroke-width="1.5" stroke-dasharray="5 4"><title>' + refTen + '</title></line>';
  return s + '</svg>';
}

/** Đường lũy kế thực tế (đến ngày chốt) và chỉ tiêu (cả tháng, nét đứt), một trục. */
function bdLuyKe(ngay, thucTe, chiTieu) {
  const W = 880, H = 450, l = 44, r = 12, t = 28, b = 26, n = ngay.length;   // khung 2/3 trang, cao bằng cột top 5 bên phải: chữ trục giữ cỡ ~11px
  const max = Math.max(1, ...chiTieu, ...thucTe.filter(v => v != null)) * 1.05;
  const x = i => l + (W - l - r) * (n > 1 ? i / (n - 1) : 0), y = v => t + (H - t - b) * (1 - v / max);
  const duong = (ds, net, mau) => '<polyline fill="none" stroke="' + mau + '" stroke-width="2"' + (net ? ' stroke-dasharray="6 4"' : '') + ' stroke-linejoin="round" points="'
    + ds.map((v, i) => v == null ? '' : x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ') + '"/>';
  let s = '<svg class="dv-bd" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  [0, .25, .5, .75, 1].forEach(k => { const v = max / 1.05 * k; s += '<line class="luoi" x1="' + l + '" x2="' + (W - r) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (l - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + Math.round(v / 1e6).toLocaleString('vi-VN') + '</text>'; });
  ngay.forEach((d, i) => { if (i % 3 === 0 || i === n - 1) s += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + d.slice(8, 10) + '</text>'; });
  s += duong(chiTieu, true, 'var(--hint)') + duong(thucTe, false, 'var(--accent)');
  // điểm hover mỗi ngày đã có số
  ngay.forEach((d, i) => { if (thucTe[i] != null) s += '<circle cx="' + x(i) + '" cy="' + y(thucTe[i]) + '" r="4" fill="var(--accent)" stroke="#fff" stroke-width="2"><title>' + ngayVN(d) + ': thực tế ' + trD(thucTe[i]) + ' tr, chỉ tiêu ' + trD(chiTieu[i]) + ' tr</title></circle>'; });
  // chỉ ghi số lũy kế ngày gần nhất và chỉ tiêu tháng (người dùng chốt 27/11/2026)

  if (n) s += '<text class="so" x="' + x(n - 1) + '" y="' + (y(chiTieu[n - 1]) - 9) + '" text-anchor="end">Chỉ tiêu ' + tr0(chiTieu[n - 1]) + '</text>';
  return s + '</svg>';
}

/** Trang tổng thể cho BGĐ (người dùng chốt 27/11/2026): 4 chỉ số theo dõi hằng tuần (26. Nhac bao duong/README.md mục 2),

function veBcNbTong(d) {
  veCnBc(d);
  const cn = Object.keys(d.dl), ten = c => TEN_CN[c] || c;
  const pt = (a, b) => b ? (Math.round(a / b * 1000) / 10).toLocaleString('vi-VN') + '%' : '–';
  const cong = (o, tien) => Object.keys(o || {}).filter(k => k.startsWith(tien)).reduce((s, k) => s + o[k], 0);
  let stt = 0;
  const the = (tieuDe, phu, noiDung) => '<div class="card" style="margin-top:16px"><h2 class="card-title">' + (++stt) + '. ' + tieuDe + '</h2>'
    + (phu ? '<div class="bc-chu" style="margin:2px 0 8px">' + phu + '</div>' : '') + noiDung + '</div>';
  const bang = (dau, hang, phai, trong) => bangBc(dau, hang, phai, 0, trong || 'Chưa đủ dữ liệu.');
  // 1. Tóm tắt: cộng dồn mọi tuần đã gửi (gửi = theo nhật ký hoặc theo kết quả Zalo nếu nhiều hơn)
  const tt = cn.map(c => {

    const gui = tu.reduce((s, w) => s + Math.max(w.gui || 0, (w.thanh_cong || 0) + cong(w, 'loi_')), 0);
    const tc = tu.reduce((s, w) => s + (w.thanh_cong || 0), 0), kq = tu.reduce((s, w) => s + (w.thanh_cong || 0) + cong(w, 'loi_'), 0);
    return { c, a, gui, tc, kq, goi: tu.reduce((s, w) => s + (w.goi || 0), 0), ve: tu.reduce((s, w) => s + (w.quay_lai || 0), 0),
      nay: (x.tuan_nay || {}).gui || 0, goiNay: (x.tuan_nay || {}).goi || 0 };
  });
  const sum = k => tt.reduce((s, r) => s + r[k], 0);
  const dongTt = r => [ten(r.c), tien(r.a), tien(r.nay), tien(r.goiNay), tien(r.gui), r.kq ? pt(r.tc, r.kq) : '–', tien(r.goi), tien(r.ve)];
  const tomTat = bang(['Đại lý', 'Xe nhóm A', 'Tuần ' + d.tuan + ': gửi', 'Tuần ' + d.tuan + ': gọi', 'Đã gửi (cộng dồn)', 'Gửi thành công', 'Đã gọi', 'Đã quay lại BD'],
    tt.map(dongTt).concat(tt.length > 1 ? [['<b>Tổng</b>', tien(sum('a')), tien(sum('nay')), tien(sum('goiNay')), tien(sum('gui')), sum('kq') ? pt(sum('tc'), sum('kq')) : '–', tien(sum('goi')), tien(sum('ve'))]] : []),
    [1, 2, 3, 4, 5, 6, 7]);
  // 2. Cơ cấu: mẫu số A1+A2+B+C1 (C2 trên 3 năm, D để ngoài mẫu số)
  const cc = c => (d.co_cau[c] || []);
  const dongCc = c => {
    const ds = cc(c), w = ds[ds.length - 1] || {}, w0 = ds[0] || {};
    const ms = x => (x.A1 || 0) + (x.A2 || 0) + (x.B || 0) + (x.C1 || 0), a = x => (x.A1 || 0) + (x.A2 || 0);
    const lech = (f, x0, x1) => ds.length > 1 ? ' <span class="mo">(' + ((Math.round((f(x1) / ms(x1) - f(x0) / ms(x0)) * 1000) / 10) >= 0 ? '+' : '')
      + (Math.round((f(x1) / ms(x1) - f(x0) / ms(x0)) * 1000) / 10).toLocaleString('vi-VN') + ')</span>' : '';
    return [ten(c), tien(ms(w)), pt(a(w), ms(w)) + lech(a, w0, w), pt(w.B || 0, ms(w)) + lech(x => x.B || 0, w0, w), pt(w.C1 || 0, ms(w)) + lech(x => x.C1 || 0, w0, w),
      tien(w.C2 || 0), tien((w.D1 || 0) + (w.D2 || 0))];
  };
  const soTuanCc = Math.max(0, ...cn.map(c => cc(c).length));
  // 3. Dòng chuyển nhóm tuần gần nhất
  const ch = c => (d.chuyen[c] || []).slice(-1)[0];
  const dongCh = c => { const x = ch(c); return x ? [ten(c), tien(x.b_a || 0), tien(x.c_a || 0), tien(x.a_b || 0), tien((x.b_a || 0) + (x.c_a || 0) - (x.a_b || 0))] : null; };
  const hangCh = cn.map(dongCh).filter(Boolean);
  // 4. Hiệu quả: xe nhận tin đủ 30 ngày → vào xưởng trong 30 ngày; xe chưa đủ 30 ngày tính riêng
  const hq = c => ((d.hieu_qua || {})[c] || {}).A || {};
  const hangHq = cn.map(c => { const x = hq(c); return [ten(c), tien(x.du30 || 0), tien(x.ve30 || 0), x.du30 ? pt(x.ve30 || 0, x.du30) : '–', tien(x.dang || 0), tien(x.ve_dang || 0)]; });
  const coHq = cn.some(c => hq(c).du30 || hq(c).dang);
  // 5. Liên lạc
  const hangLl = cn.map(c => {
    const x = d.dl[c], tu = x.tuan || [], ll = x.lien_lac || {}, a = ((x.xe || {}).A1 || 0) + ((x.xe || {}).A2 || 0);
    const kq = tu.reduce((s, w) => s + (w.thanh_cong || 0) + cong(w, 'loi_'), 0), tc = tu.reduce((s, w) => s + (w.thanh_cong || 0), 0);
    return [ten(c), tien(kq), kq ? pt(tc, kq) : '–', tien(tu.reduce((s, w) => s + (w.loi_2 || 0), 0)), tien(kq - tc - tu.reduce((s, w) => s + (w.loi_2 || 0), 0)),
      tien(ll.thieu_sdt_a || 0) + ' <span class="mo">(' + pt(ll.thieu_sdt_a || 0, a) + ')</span>', tien(ll.can_kt || 0)];
  });
  $('bc-nd').innerHTML = '<div class="bc-chu">Tuần ' + d.tuan + ', dữ liệu DMS đến ' + ngayVN(d.ngay_dl) + ', cập nhật ' + esc(d.cap_nhat)
    + '. Các đại lý đặt cạnh nhau để theo dõi, không xếp hạng. Chọn từng đại lý ở trên để xem danh sách xe.</div>'
    + the('Tóm tắt', 'Nhóm A (khách đang bảo dưỡng đều) được nhắn trước; các nhóm khác khởi động sau.', tomTat)
    + the('Cơ cấu khách', 'Tỷ lệ trên mẫu số A + B + C1 (C2 trên 3 năm và D để ngoài mẫu số). Mục tiêu: A tăng, B và C giảm.'
      + (soTuanCc > 1 ? ' Số trong ngoặc: thay đổi so với tuần ' + cc(cn[0])[0].tuan + ' (điểm %).' : ' Mới có mốc tuần ' + ((cc(cn[0])[0] || {}).tuan || '') + '; xu hướng hiện từ tuần sau, rõ sau 4–8 tuần.'),
      bang(['Đại lý', 'Mẫu số', 'Nhóm A', 'Nhóm B', 'Nhóm C1', 'C2 (ngoài)', 'D (ngoài)'], cn.map(dongCc), [1, 2, 3, 4, 5, 6]))
    + the('Dòng chuyển nhóm trong tuần', 'Kéo về: khách nhóm B, C quay lại thành nhóm A. Rơi ra: khách nhóm A quá 8 tháng chưa quay lại thành nhóm B. Mục tiêu: kéo về nhiều hơn rơi ra.',
      hangCh.length ? bang(['Đại lý', 'Kéo về B → A', 'Kéo về C → A', 'Rơi ra A → B', 'Chênh lệch'], hangCh, [1, 2, 3, 4]) : '<p class="mo">Chưa đủ dữ liệu: cần số liệu 2 tuần liền nhau (có từ tuần 49).</p>')
    + the('Hiệu quả nhắn (nhóm A)', 'Khách vào bảo dưỡng trong 30 ngày sau tin đầu tiên. Chỉ tính xe đã nhận tin đủ 30 ngày; xe mới nhận tin để riêng.',
      coHq ? bang(['Đại lý', 'Xe nhận tin đủ 30 ngày', 'Vào xưởng trong 30 ngày', 'Tỷ lệ', 'Xe nhận tin chưa đủ 30 ngày', 'Đã quay lại'], hangHq, [1, 2, 3, 4, 5])
        : '<p class="mo">Chưa đủ dữ liệu: tin đầu tiên gửi 25–27/11/2026, tỷ lệ 30 ngày có từ cuối tháng 12/2026.</p>')
    + the('Chất lượng liên lạc', 'Thiếu/sai SĐT: xe nhóm A không có số di động hợp lệ trên DMS (không nhắn được); cần phòng dịch vụ bổ sung khi khách vào xưởng.',
      bang(['Đại lý', 'Tin có kết quả', 'Gửi thành công', 'Không có Zalo', 'Lỗi khác', 'Nhóm A thiếu/sai SĐT', 'Cần CVDV sửa DMS'], hangLl, [1, 2, 3, 4, 5, 6]));
}
function veNgauNhien() {

/** Bảng Tổng hợp; quá `gioi` dòng thì ẩn phần sau, có nút "Xem thêm". */
function bangBc(dau, hang, phai, gioi, trong) {
  if (!hang.length) return '<p class="mo">' + trong + '</p>';
  const td = (v, i, the) => '<' + the + (phai.includes(i) ? ' class="r"' : '') + '>' + v + '</' + the + '>';
  const them = gioi && hang.length > gioi ? hang.length - gioi : 0;
  return '<table class="bang"><thead><tr>' + dau.map((h, i) => td(h, i, 'th')).join('') + '</tr></thead><tbody>'
    + hang.map((h, j) => '<tr' + (them && j >= gioi ? ' class="them"' : '') + '>' + h.map((v, i) => td(v, i, 'td')).join('') + '</tr>').join('') + '</tbody></table>'
    + (them ? '<button class="xem-them" data-xem-them>Xem thêm ' + them + ' dòng</button>' : '');
}
/** Nút chi nhánh chỉ hiện khi xem được từ 2 chi nhánh; 1 chi nhánh thì tên hiện ở thanh trên cùng.

const anThanhBc = () => { $('man-bc').querySelector('.thanh-tra').hidden = !$('bc-muc').innerHTML && !$('bc-cn').innerHTML && $('bc-ngay').hidden && $('bc-ve').hidden && !$('bc-loi').textContent; };

async function bcTai() {
  const muc = [['dv', 'Dịch vụ', META.xemDv], ['lt', 'Lễ tân DV', META.xemBc], ['ls', 'Công việc cần làm sớm', META.xemLs], ['nb', 'Nhắc bảo dưỡng', META.xemNb]]
    .filter(m => (m[2] || []).length);
  if (!muc.some(m => m[0] === BC.muc)) BC.muc = (muc[0] || ['lt'])[0];
  $('bc-muc').innerHTML = muc.length > 1 ? muc
    .map(([m, t]) => '<button data-muc="' + m + '" class="' + (m === BC.muc ? 'on' : '') + '">' + t + '</button>').join('') : '';
  $('bc-ngay').hidden = BC.muc !== 'lt';
  $('bc-loi').textContent = ''; $('bc-nd').innerHTML = '<p class="mo">Đang tải…</p>';
  try {
    if (BC.muc === 'ls') veBcLs(await goi('bcLamSom', PHIEN.token, BC.cn));
    else if (BC.muc === 'nb') await bcNb();
    else if (BC.muc === 'dv') veBcDv(await goi('bcDichVu', PHIEN.token, BC.cn));
    else veBc(await goi('bcLeTan', PHIEN.token, $('bc-ngay').value, BC.cn));

}

    + o('Ghi đúng mẫu', ptc(pt(g.mau, g.lenh)), ptc(pt(m.mau, m.lenh)))
    + o('Có việc cần làm', ptc(pt(g.ph, g.lenh)), ptc(pt(m.ph, m.lenh)))
    + o('Chỉ mốc BD / trống', ptc(pt(g.moc_bd, g.lenh)), ptc(pt(m.moc_bd, m.lenh)), pt(g.moc_bd, g.lenh) > 50 ? 'do' : '')
    + o('Ghi chi tiết', ptc(pt(g.tot, g.ph)), ptc(pt(m.tot, m.ph)))
    + o('Việc "Làm ngay"', g.lam_ngay || 0, null) + '</div>'
    + '<div class="bc-chu">Số liệu 4 tuần gần nhất; "trước" là bình quân 8–10/2026, trước khi áp dụng mẫu.</div>'
    + '<div class="card" style="margin-top:16px"><h2 class="card-title">1. Theo tuần</h2>'
    + '<div class="bc-chu">Mẫu 3 nhãn áp dụng từ 02/11/2026; các tuần trước là mốc so sánh. Chỉ lệnh BD, SCC đã có trong file RO gốc.</div>'
    + bang(['Tuần từ', 'Lệnh', 'Đúng mẫu', 'Có việc', 'Chỉ mốc', 'Làm ngay'], d.tuan.slice().reverse().map(x => [
      ngayVN(x.tu).slice(0, 5) +(x.tu >= '2026-11-02' ? '<br>' + tag('áp dụng') : ''), x.lenh,
      thanh(pt(x.mau, x.lenh)) + ptc(pt(x.mau, x.lenh)), thanh(pt(x.ph, x.lenh)) + ptc(pt(x.ph, x.lenh)), ptc(pt(x.moc_bd, x.lenh)), x.lam_ngay || 0]), [1, 2, 3, 4, 5])
    + '</div><div class="bc-2">'
    + '<div class="card"><h2 class="card-title">2. Theo CVDV (30 ngày)</h2>' + bang(['CVDV', 'Lệnh', 'Đúng mẫu', 'Có việc', 'Chi tiết'],
      d.cvdv.map(c => [esc(c.cv), c.lenh, ptc(pt(c.mau, c.lenh)), ptc(pt(c.ph, c.lenh)), ptc(pt(c.tot, c.ph))]), [1, 2, 3, 4]) + '</div>'
    + '<div class="card"><h2 class="card-title">3. Ghi chép gần nhất</h2>' + bang(['Ngày', 'CVDV', 'Nội dung'],
      d.gan.map(x => [ngayVN(x[0]).slice(0, 5), esc(x[1]), esc(x[2]) + '<div style="margin-top:2px">' + (x[4] ? tag('Đúng mẫu', 'xanh') + ' ' : '')
        + LOAI[x[3]] + (x[5] ? ' <span class="mo" style="font-size:var(--fs-1)">' + MUC[x[5]] + '</span>' : '') + '</div>']), [], 8) + '</div>'
    + '</div>';
}

$('bc-muc').onclick = e => { const b = e.target.closest('[data-muc]'); if (b) { BC.muc = b.dataset.muc; BC.cn = null; bcTai(); } };
$('bc-ngay').onchange = bcTai;
$('bc-ve').onclick = e => { e.preventDefault(); hien('tra'); };
$('bc-cn').onclick = e => { const b = e.target.closest('[data-cn]'); if (b) { BC.cn = b.dataset.cn; bcTai(); } };
$('bc-nd').onclick = e => {
  const b = e.target.closest('[data-xem-them]');
  if (b) { b.previousElementSibling.classList.add('mo-het'); b.remove(); }
  // Biển số trong mục Nhắc bảo dưỡng: mở tra cứu xe đó (CSKH kiểm tra ngẫu nhiên trước khi gửi)
  const a = e.target.closest('[data-nb]');
  if (a) { e.preventDefault(); hien('tra'); $('bien').value = a.dataset.nb; traCuu(a.dataset.nb); }
  if (e.target.closest('[data-ngau-nhien]')) { e.preventDefault(); veNgauNhien(); }
  const bh = e.target.closest('[data-bh]');
  if (bh) { DV_BH.boNgap = bh.dataset.bh === 'true'; veBh(); }
};

$('lt-them').onclick = () => ltThem();
$('lt-bien').onkeydown = e => { if (e.key === 'Enter') ltThem(); };

document.addEventListener('click', e => {
  const b = e.target.closest('[data-loc]');
  if (b && XE) $('lich-su').innerHTML = veLs(XE, b.dataset.loc === 'bd');
});

$('nut-dn').onclick = dangNhap;
$('mk').onkeydown = e => { if (e.key === 'Enter') dangNhap(); };
$('nut-tra').onclick = () => traCuu();
$('bien').onkeydown = $('km').onkeydown = e => { if (e.key === 'Enter') traCuu(); };
$('thoat').onclick = thoat;

(async () => {
  try { PHIEN = JSON.parse(localStorage.getItem('gtgt')) || JSON.parse(sessionStorage.getItem('gtgt')); } catch (e) {}
  if (PHIEN && PHIEN.het && PHIEN.het < Date.now()) { thoat(); $('loi-dn').textContent = 'Hết phiên làm việc, đăng nhập lại.'; return; }
  if (PHIEN) {
    try { META = await goi('layMeta', PHIEN.token); return hien('tra'); } catch (e) { PHIEN = null; }
  }
  hien('dn');
})();
</script>
