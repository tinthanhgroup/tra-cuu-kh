  const them = gioi && hang.length > gioi ? hang.length - gioi : 0;
  return '<table class="bang' + (rong ? ' co-dinh' : '') + '">' + cg + '<thead><tr>' + dau.map((h, i) => td(h, i, 'th')).join('') + '</tr></thead><tbody>'
    + hang.map((h, j) => '<tr' + (them && j >= gioi ? ' class="them"' : '') + '>' + h.map((v, i) => td(v, i, 'td')).join('') + '</tr>').join('') + '</tbody></table>'
    + (them ? '<button class="xem-them" data-xem-them>Xem thêm ' + them + ' dòng</button>' : '');
}
/** Nút chi nhánh chỉ hiện khi xem được từ 2 chi nhánh; 1 chi nhánh thì tên hiện ở thanh trên cùng.
 *  Thanh lọc không còn gì (không nút, không ô ngày, không lỗi) thì ẩn luôn. */
function veCnBc(d) {
  BC.cn = d.cn;
  $('bc-cn').innerHTML = d.cacCn.length > 1 ? d.cacCn.map(c => '<button data-cn="' + c + '" class="' + (c === d.cn ? 'on' : '') + '">' + (TEN_CN[c] || c) + '</button>').join('') : '';
  if (!$('man-bc').hidden) { $('cn').textContent = TEN_CN[d.cn] || d.cn; $('cn').hidden = d.cacCn.length > 1; }
  anThanhBc();
}
const anThanhBc = () => { $('man-bc').querySelector('.thanh-tra').hidden = !$('bc-muc').innerHTML && !$('bc-cn').innerHTML && $('bc-ngay').hidden && $('bc-ve').hidden && !$('bc-loi').textContent; };

/** Ô KPI "Nhắc bảo dưỡng tuần NN" trong 1. Tổng hợp: số tin gửi tuần này (theo danh sách hoặc kết quả Zalo nếu nhiều hơn),
 *  thành công / cần gọi; bấm vào mở phần chi tiết nhắc bảo dưỡng. nb: kết quả bcNhacBd (1 chi nhánh) hoặc bcNhacBdTong. */
function oNhacBd(nb) {
  const ds = nb.dl ? Object.values(nb.dl) : [nb];
  const loi = w => Object.keys(w).filter(k => k.startsWith('loi_')).reduce((s, k) => s + w[k], 0);
  let tuan = null, gui = 0, tc = 0, kq = 0, goiX = 0;
  ds.forEach(x => {
    const n = x.tuan_nay || {}, w = (x.tuan || []).find(q => q.tuan === n.tuan && (!n.thu2 || q.thu2 === n.thu2)) || {};
    tuan = tuan || n.tuan; gui += Math.max(n.gui || 0, (w.thanh_cong || 0) + loi(w)); tc += w.thanh_cong || 0; kq += (w.thanh_cong || 0) + loi(w); goiX += n.goi || 0;
  });
  if (!tuan) return '';
  const phu = (kq ? tien(tc) + ' thành công' : 'chưa có kết quả Zalo') + (goiX ? ' · ' + tien(goiX) + ' cần gọi' : '');
  return '<div data-muc="nb" title="Bấm để xem chi tiết nhắc bảo dưỡng"><div class="nhan">Nhắc bảo dưỡng tuần ' + tuan + '</div><div class="so">'
    + tien(gui) + ' tin</div><div class="nhan">' + phu + '</div><div class="o-xem">Xem danh sách ›</div></div>';
}

let BC_LUOT = 0;
async function bcTai() {
  const luot = ++BC_LUOT;
  // nhóm mục (đánh số theo thứ tự hiện) tách khỏi nhóm chi nhánh (người dùng chốt 27/11/2026)
  // Nhắc bảo dưỡng nằm trong 1. Tổng hợp: vào bằng ô KPI "Nhắc bảo dưỡng tuần" (người dùng chốt 28/11/2026)
  const muc = [['dv', 'Tổng hợp', META.xemDv], ['lt', 'Tiếp nhận', META.xemBc], ['ls', 'Công việc cần làm sớm', META.xemLs]]
    .filter(m => (m[2] || []).length).map((m, i) => [m[0], (i + 1) + '. ' + m[1], m[2]]);
  if (!(BC.muc === 'nb' && (META.xemNb || []).length) && !muc.some(m => m[0] === BC.muc)) BC.muc = (muc[0] || ['lt'])[0];
  const mucSang = BC.muc === 'nb' ? 'dv' : BC.muc;
  $('bc-muc').innerHTML = muc.length > 1 ? muc
    .map(([m, t]) => '<button data-muc="' + m + '" class="' + (m === mucSang ? 'on' : '') + '">' + t + '</button>').join('') : '';
  $('bc-ngay').hidden = BC.muc !== 'lt';
  $('bc-loi').textContent = '';
  // đang xem mục này: làm mờ trang cũ trong lúc tải (không xóa → không nháy, không nhảy vị trí); mục khác thì "Đang tải…"
  const nd = $('bc-nd'), cungMuc = nd.dataset.muc === BC.muc;
  if (cungMuc) { nd.style.minHeight = nd.offsetHeight + 'px'; nd.classList.add('dang-tai'); } else nd.innerHTML = '<p class="mo">Đang tải…</p>';
  nd.dataset.muc = BC.muc;
  try {
    if (BC.muc === 'ls') veBcLs(await goi('bcLamSom', PHIEN.token, BC.cn));
    else if (BC.muc === 'nb') await bcNb();
    else if (BC.muc === 'dv') {
      const cacDv = (META.xemDv || []).concat(META.xemNbTong ? ['ALL'] : []);   // "Toàn hệ thống" cuối (ADMIN, CSKH, GĐDV, quản lý)
      if (!BC.cn || cacDv.indexOf(BC.cn) < 0) BC.cn = cacDv.indexOf(cnMacDinh()) >= 0 ? cnMacDinh() : cacDv[0];
      const laNb = (META.xemNb || []).indexOf(BC.cn) >= 0 || (BC.cn === 'ALL' && META.xemNbTong);
      const [dv, nb] = await Promise.all([goiNho(BC.cn === 'ALL' ? 'bcDichVuTong' : 'bcDichVu', BC.cn),
        laNb ? goiNho(BC.cn === 'ALL' ? 'bcNhacBdTong' : 'bcNhacBd', BC.cn).catch(() => null) : null]);
      const d = Object.assign({}, dv, { cacCn: cacDv, nbO: nb ? oNhacBd(nb) : '' });
      if (luot !== BC_LUOT) return;   // đã bấm chi nhánh khác: bỏ kết quả cũ
      if (BC.cn === 'ALL') veBcDvTong(d); else veBcDv(d);
      canChanCot();
      (META.xemDv || []).forEach(c => goiNho('bcDichVu', c));   // tải sẵn các chi nhánh khác trong nền
      (META.xemNb || []).forEach(c => goiNho('bcNhacBd', c).catch(() => {}));
      if (META.xemNbTong) goiNho('bcDichVuTong', 'ALL');
    }
    else veBc(await goi('bcLeTan', PHIEN.token, $('bc-ngay').value, BC.cn));
  }
  catch (e) {
    if (luot !== BC_LUOT) return;
    $('bc-nd').innerHTML = '';
    if (e.message.includes('HET_PHIEN')) { thoat(); $('loi-dn').textContent = 'Hết phiên làm việc, đăng nhập lại.'; }
    else $('bc-loi').textContent = e.message;
    anThanhBc();
  }
  if (luot === BC_LUOT) { nd.classList.remove('dang-tai'); requestAnimationFrame(() => { nd.style.minHeight = ''; }); }
}

function veBc(d) {
  veCnBc(d);
  // Ô số ghi "phút"; trong bảng chỉ ghi số, một dòng chú thích chung về đơn vị
  const t = d.ngayNay, phut = v => v == null ? '–' : v + ' phút', so = v => v == null ? '–' : v;
  const o = (nhan, so, lop) => '<div><div class="nhan">' + nhan + '</div><div class="so' + (lop ? ' ' + lop : '') + '">' + so + '</div></div>';
  const bang = (dau, hang, phai, gioi) => bangBc(dau, hang, phai, gioi, 'Không có.');
  // Bảng đánh số theo thứ tự trên màn hình để dễ nhắc tên khi trao đổi (quy chuẩn tinh tế, nguyên tắc 10)
  let stt = 0;
  const the = (tieuDe, noiDung, kieu) => '<div class="card"' + (kieu ? ' style="' + kieu + '"' : '') + '><h2 class="card-title">' + (++stt) + '. ' + tieuDe + '</h2>' + noiDung + '</div>';
  const chu = '<div class="bc-chu">Thời gian chờ tính bằng phút, từ giờ vào tới khi CVDV nhận.</div>';
  const maxN = Math.max(1, ...d.xuHuong.map(x => x.n)), maxG = Math.max(1, ...t.theoGio.map(g => g.n));
  // 30 ngày: thanh Khách tách phần khách hẹn (màu nhấn đậm) và khách khác (nhạt), kèm chú thích và cột Hẹn (người dùng yêu cầu
  // 17/11/2026). Chỉ chi nhánh có lịch hẹn (hen khác null). Khách hẹn DMS nhiều hơn số khách lễ tân nhập thì phần hẹn = cả thanh
  const coHen = d.xuHuong.some(x => x.hen != null);
  const thanhKhach = x => {
    const r = Math.round(x.n / maxN * 80), h = coHen && x.hen ? Math.round(Math.min(x.hen, x.n) / maxN * 80) : 0;
    return '<span class="bc-thanh2" style="width:' + r + 'px">' + (h ? '<i style="width:' + h + 'px"></i>' : '') + '</span>';
  };
  const chuThich = '<div class="bc-chu bc-chu-thanh"><span class="o-hen"></span>Khách hẹn <span class="o-khac"></span>Khách khác</div>';
  $('bc-nd').innerHTML = (t.n ? '' : '<div class="card"><p class="mo">Ngày ' + ngayVN(d.ngay) + ' chưa có khách nào được lễ tân nhập.</p></div>')
    + (t.n ? '<div class="bc-so">' + o('Khách', t.n) + o('Khách hẹn', t.hen == null ? '–' : t.hen) + o('Chờ trung bình', phut(t.tb)) + o('Chờ trung vị', phut(t.tv))
      + o('Chờ quá ' + d.choLau + ' phút', t.lau.length + ' xe', t.lau.length ? 'do' : '') + o('Nhận đúng khuyến nghị', t.coKn ? t.dungKn + '/' + t.coKn : '–') + '</div>'
      + chu
      + '<div class="bc-2 bc-3">'
      + the('5 xe chờ lâu nhất', bang(['Biển số', 'Vào', 'Nhận', 'Chờ', 'CVDV'], (t.top5 || t.lau).slice(0, 5).map(r => [esc(r.b), r.gio, r.gioNhan,
        r.cho > d.choLau ? '<span class="t-do">' + r.cho + '</span>' : r.cho, esc(r.cvdv)]), [3]))
      + the('Theo CVDV', bang(['CVDV', 'Số xe nhận', 'Chờ TB'], t.theoCv.map(c => [esc(c.cvdv), c.n, c.tb]), [1, 2]))
      // Thanh dài nhất = khung giờ đông nhất
      + the('Khách theo khung giờ vào', bang(['Giờ', 'Số khách'], t.theoGio.map(g => [g.gio, '<span class="bc-thanh" style="width:' + Math.round(g.n / maxG * 120) + 'px"></span>' + g.n]), [1]))
      + '</div>' : '')
    + the('30 ngày gần nhất', (t.n ? '' : chu) + (coHen ? chuThich : '') + bang(['Ngày', 'Khách'].concat(coHen ? ['Hẹn'] : [], ['Chờ TB', 'Quá ' + d.choLau + ' phút', 'Chưa nhận']),
      d.xuHuong.slice().reverse().map(x => [ngayVN(x.ngay).slice(0, 5), thanhKhach(x) + x.n].concat(coHen ? [so(x.hen)] : [],
        [so(x.tb), x.lau ? '<span class="t-do">' + x.lau + '</span>' : '0', x.chua])), coHen ? [1, 2, 3, 4, 5] : [1, 2, 3, 4], 7), 'margin-top:16px');
}

/** Công việc cần làm sớm: 4 tuần gần nhất so với mốc 8–10/2026 (trước khi áp dụng mẫu 3 nhãn), theo tuần, theo CVDV, ghi chép gần nhất. */
function veBcLs(d) {
  veCnBc(d);
  const pt = (a, b) => b ? Math.round((a || 0) / b * 100) : null, ptc = v => v == null ? '–' : v + '%';
  const cong = ds => ds.reduce((s, x) => { Object.keys(x).forEach(k => { if (typeof x[k] === 'number') s[k] = (s[k] || 0) + x[k]; }); return s; }, {});
  const g = cong(d.tuan.slice(-4)), m = d.moc || {};
  const o = (nhan, nay, truoc, lop) => '<div><div class="nhan">' + nhan + '</div><div class="so' + (lop ? ' ' + lop : '') + '">' + nay + '</div>'
    + (truoc != null ? '<div class="nhan">trước ' + truoc + '</div>' : '') + '</div>';
  const thanh = (v, max) => '<span class="bc-thanh" style="width:' + Math.round((v || 0) / (max || 100) * 70) + 'px"></span>';
  const bang = (dau, hang, phai, gioi) => bangBc(dau, hang, phai, gioi, 'Chưa có dữ liệu.');
  const LOAI = { khong_viec: tag('Không có việc', 'xanh'), phat_hien: tag('Có việc'), khong_phat_hien: tag('Chỉ mốc BD / chung chung', 'do') };
  const MUC = ['', 'sơ sài', 'đạt', 'chi tiết'];
  $('bc-nd').innerHTML = '<div class="bc-so">'
    + o('Lệnh BD, SCC / tuần', Math.round((g.lenh || 0) / Math.max(1, Math.min(4, d.tuan.length))), m.lenh ? Math.round(m.lenh / 13) : null)
    + o('Ghi đúng mẫu', ptc(pt(g.mau, g.lenh)), ptc(pt(m.mau, m.lenh)))
    + o('Có việc cần làm', ptc(pt(g.ph, g.lenh)), ptc(pt(m.ph, m.lenh)))
    + o('Chỉ mốc BD / trống', ptc(pt(g.moc_bd, g.lenh)), ptc(pt(m.moc_bd, m.lenh)), pt(g.moc_bd, g.lenh) > 50 ? 'do' : '')
    + o('Ghi chi tiết', ptc(pt(g.tot, g.ph)), ptc(pt(m.tot, m.ph)))
    + o('Việc "Làm ngay"', g.lam_ngay || 0, null) + '</div>'
    + '<div class="bc-chu">Số liệu 4 tuần gần nhất; "trước" là bình quân 8–10/2026, trước khi áp dụng mẫu.</div>'
    + '<div class="card" style="margin-top:16px"><h2 class="card-title">1. Theo tuần</h2>'
    + '<div class="bc-chu">Mẫu 3 nhãn áp dụng từ 02/11/2026; các tuần trước là mốc so sánh. Chỉ lệnh BD, SCC đã có trong file RO gốc.</div>'
    + bang(['Tuần từ', 'Lệnh', 'Đúng mẫu', 'Có việc', 'Chỉ mốc', 'Làm ngay'], d.tuan.slice().reverse().map(x => [
      ngayVN(x.tu).slice(0, 5) +(x.tu >= '2026-11-02' ? '<br>' + tag('áp dụng') : ''), x.lenh,
      thanh(pt(x.mau, x.lenh)) + ptc(pt(x.mau, x.lenh)), thanh(pt(x.ph, x.lenh)) + ptc(pt(x.ph, x.lenh)), ptc(pt(x.moc_bd, x.lenh)), x.lam_ngay || 0]), [1, 2, 3, 4, 5])
    + '</div><div class="bc-2">'
    + '<div class="card"><h2 class="card-title">2. Theo CVDV (30 ngày)</h2>' + bang(['CVDV', 'Lệnh', 'Đúng mẫu', 'Có việc', 'Chi tiết'],
      d.cvdv.map(c => [esc(c.cv), c.lenh, ptc(pt(c.mau, c.lenh)), ptc(pt(c.ph, c.lenh)), ptc(pt(c.tot, c.ph))]), [1, 2, 3, 4]) + '</div>'
    + '<div class="card"><h2 class="card-title">3. Ghi chép gần nhất</h2>' + bang(['Ngày', 'CVDV', 'Nội dung'],
      d.gan.map(x => [ngayVN(x[0]).slice(0, 5), esc(x[1]), esc(x[2]) + '<div style="margin-top:2px">' + (x[4] ? tag('Đúng mẫu', 'xanh') + ' ' : '')
        + LOAI[x[3]] + (x[5] ? ' <span class="mo" style="font-size:var(--fs-1)">' + MUC[x[5]] + '</span>' : '') + '</div>']), [], 8) + '</div>'
    + '</div>';
}

$('bc-muc').onclick = e => { const b = e.target.closest('[data-muc]'); if (b) { BC.muc = b.dataset.muc; bcTai(); } };   // giữ chi nhánh đang chọn
$('bc-ngay').onchange = bcTai;
$('bc-ve').onclick = e => { e.preventDefault(); hien('tra'); };
$('bc-cn').onclick = e => { const b = e.target.closest('[data-cn]'); if (b) { BC.cn = b.dataset.cn; bcTai(); } };
$('bc-nd').onclick = e => {
  const m = e.target.closest('[data-muc]');
  if (m) { e.preventDefault(); BC.muc = m.dataset.muc; bcTai(); return; }
  const b = e.target.closest('[data-xem-them]');
  if (b) { b.previousElementSibling.classList.add('mo-het'); b.remove(); }
  // Biển số trong mục Nhắc bảo dưỡng: mở tra cứu xe đó (CSKH kiểm tra ngẫu nhiên trước khi gửi)
  const a = e.target.closest('[data-nb]');
  if (a) { e.preventDefault(); hien('tra'); $('bien').value = a.dataset.nb; traCuu(a.dataset.nb); }
  if (e.target.closest('[data-ngau-nhien]')) { e.preventDefault(); veNgauNhien(); }
  const bh = e.target.closest('[data-bh]');
  if (bh) { DV_BH.boNgap = bh.dataset.bh === 'true'; veBh(); }
  const bhx = e.target.closest('[data-bhx]');
  if (bhx) { DV_BH.x = bhx.dataset.bhx; veBh(); }
  const ncx = e.target.closest('[data-ncx]');
  if (ncx) { DV_NC_X = ncx.dataset.ncx; veNc(); }
};

$('lt-them').onclick = () => ltThem();
$('lt-bien').onkeydown = e => { if (e.key === 'Enter') ltThem(); };

document.addEventListener('click', e => {
  const b = e.target.closest('[data-loc]');
  if (b && XE) $('lich-su').innerHTML = veLs(XE, b.dataset.loc === 'bd');
});

$('nut-dn').onclick = dangNhap;
$('mk').onkeydown = e => { if (e.key === 'Enter') dangNhap(); };
$('nut-tra').onclick = () => traCuu();
$('bien').onkeydown = $('km').onkeydown = e => { if (e.key === 'Enter') traCuu(); };
$('thoat').onclick = thoat;

(async () => {
  try { PHIEN = JSON.parse(localStorage.getItem('gtgt')) || JSON.parse(sessionStorage.getItem('gtgt')); } catch (e) {}
  if (PHIEN && PHIEN.het && PHIEN.het < Date.now()) { thoat(); $('loi-dn').textContent = 'Hết phiên làm việc, đăng nhập lại.'; return; }
  if (PHIEN) {
    try { META = await goi('layMeta', PHIEN.token); return hien('tra'); } catch (e) { PHIEN = null; }
  }
  hien('dn');
})();
</script>
